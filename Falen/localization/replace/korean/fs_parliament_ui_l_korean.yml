 appoint_cardinal_interaction_notification: "그대의 신앙심과 신중함에 관한 이야기가 내게까지 전해졌으며, 대한민국 헌법을 수호하는 데 있어서는 그대와 같은 종복이 귀중하오. 금뱃지를 받아 나의 의원단에 자리를 함께하시오. 내가 살아 있는 동안에는 내게 조언하고, 내가 떠난 뒤에는 내 뒤를 이을 이를 뽑는 데 힘을 보태시오."
