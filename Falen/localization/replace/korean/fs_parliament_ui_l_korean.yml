 theocratic_elective_succession_law_effects: "\n[college_of_cardinals|E]의 [cardinals|E]은 자기들 가운데서 [title_heir|E]를 선출합니다. 모든 국회의원은 [elector|E]인 동시에 후보자입니다. [papabile_score|E]가 높은 의원일수록 더 많은 표를 받을 가능성이 높습니다."
