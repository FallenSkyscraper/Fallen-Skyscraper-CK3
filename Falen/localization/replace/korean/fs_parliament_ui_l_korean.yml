l_korean:
 # Shared vanilla College of Cardinals localization overrides for the Koreanist parliament.
 # Labels use MP / National Assembly / President terminology.
 # TODO: Rewrite the copied vanilla descriptions, tooltips and notifications below.
 # Preserve localization keys, [...] bindings, $...$ substitutions, icons and escaped newlines.
 # Character titles already use cardinal_koreanism_* in fs_special_titles_l_korean.yml
 # and koreanism_religious_head_title in religion/fs_religion_koreanism_l_korean.yml.
 # These vanilla keys are shared; this file also changes them wherever another faith uses them.

 # Game concepts and linked glossary descriptions
 # Vanilla source: localization/korean/dlc/pam/pam_game_concepts_l_korean.yml
 game_concept_cardinal: "국회의원"
 game_concept_cardinals: "국회의원"
 game_concept_cardinal_possessive: "국회의원의"
 game_concept_cardinals_possessive: "국회의원의"
 game_concept_cardinalate: "국회의원직"
 game_concept_cardinalates: "국회의원직"
 game_concept_cardinal_desc: "대한민국 국민의 뜻을 더 멀리 행사할 수 있도록 대통령에 의해 선출되는 [clergy|e] 구성원입니다. [college_of_cardinals|E]의 모든 구성원은 대통령 후보인 동시에 대통령 선출 유권자이며, [papabile_score|E]를 보유합니다."
 game_concept_college_of_cardinals: "대한민국 국회"
 game_concept_college_of_cardinals_desc: "$game_concept_college_of_cardinals$는 대한민국의 법률을 제정하는 곳이면서 한국교의 다음 [head_of_faith|E]를 선출하는 기관입니다.\n\n모든 [cardinal|E]은 대통령 후보인 동시에 대통령 선거권자입니다."
 game_concept_papabile_score: "대통령 후보 점수"
 game_concept_papabile_scores: "대통령 후보 점수"
 game_concept_papabile_score_desc: "모든 [college_of_cardinals|E] 구성원은 각자의 [traits|E], [piety_level|E], [rite|E] 및 다른 의원들의 [opinion|E]에 따라 산출되는 $game_concept_papabile_score$를 보유합니다.\n\n$game_concept_papabile_score$가 가장 높은 [cardinals|E]은 대통령 선출 시 높은 확률로 표를 더 많이 받습니다.\n\n$game_concept_papabile_score$는 #high $increase_papabile_score_interaction$#! [character_interaction|E] 및 [GetDecisionWithKey('pam_promulgate_word_of_pious_deeds_decision').GetName] [decision|E]으로 증가시킬 수 있습니다."

