l_english:
 trade_good_tobacco: "Tobacco"
 trade_good_tobacco_desc: "Tobacco leaves are cured for their distinctive aroma. Their quality varies with the growing region and the way they are prepared."
 trade_good_potato: "Potatoes"
 trade_good_potato_desc: "Potatoes are a food crop harvested for their underground tubers. Boiled or roasted, they help sustain communities alongside grain."
 trade_good_maize: "Maize"
 trade_good_maize_desc: "Maize bears kernels on large cobs. The kernels are eaten fresh, dried and ground, or used to feed livestock."
 trade_good_chili: "Chili Peppers"
 trade_good_chili_desc: "Chili peppers give food its heat. Used fresh or dried, they underpin distinctive seasonings and cooking traditions."
 trade_good_sweet_potato: "Sweet Potatoes"
 trade_good_sweet_potato_desc: "Sweet potatoes are grown for their sweet storage roots. They are roasted, steamed, or dried for keeping."
 trade_good_spirits: "Spirits"
 trade_good_spirits_desc: "Spirits are strong alcoholic drinks obtained by distilling fermented liquor. Their flavor varies with the ingredients and the method of distillation."
 trade_good_opium: "Opium"
 trade_good_opium_desc: "Opium is dried poppy latex, traded as a medicinal and intoxicating substance."
 trade_good_coal: "Coal"
 trade_good_coal_desc: "Coal is a black mineral fuel mined from underground. Its lasting heat serves hearths and a range of crafts."
 trade_good_ginseng: "Ginseng"
 trade_good_ginseng_desc: "Ginseng roots are prized for their distinctive aroma and taste. Dried for keeping, they are exchanged as valuable gifts and served to honored guests."
 trade_good_slave: "Slaves"
 trade_good_slave_desc: "Enslaved people are deprived of freedom and subjected to sale. Their status is governed by the customs and laws of the societies that hold them in bondage."
 trade_category_fuel: "Fuel"
 trade_category_fuel_desc: "Fuels such as coal supply heat for hearths and crafts."
 trade_category_slaves: "Slaves"
 trade_category_slaves_desc: "A separate trade category for people subjected to sale under systems of slavery."
