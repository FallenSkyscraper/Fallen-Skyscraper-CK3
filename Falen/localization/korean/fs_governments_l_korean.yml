l_korean:
 military_government: "군정"
 military_government_with_icon: "@military_administration! $military_government$"
 military_government_adjective: "군정제"
 military_government_realm: "군정"
 military_government_vassals_label: "군정"
 military_government_desc: "$game_concept_military_desc$\n\n#F 군정은 문명이 붕괴된 이후 각 국가의 파편화된 정규군에서 기원합니다. 과거의 유산으로 이어져 내려온 군사행정 체계하에서 군정은 당면한 전쟁의 승리를 위해 작전 교리를 선택하고 일시적으로 모든 인력을 총동원할 수 있습니다. 국가가 있어야 국민도 있는 법입니다."
 game_concept_military: "군정"
 game_concept_military_desc: "군정 [government_form|E]는 봉신이 주군에게 [taxes|E]의 대부분을 바치고, 다시 주군의 연수입의 일부를 예산으로 돌려받습니다. 또한 민중의 희생을 감수하고 직할령에서 대규모의 군대를 징집하는 총력전을 실행할 수 있습니다."
 maritime_government: "해양 제국"
 maritime_government_with_icon: "@naval_administration! $maritime_government$"
 maritime_government_adjective: "해양 제국"
 maritime_government_realm: "해양 제국"
 maritime_government_vassals_label: "해양 제국"
 maritime_government_desc: "해양 제국 [government_form|E]은 전라남도 일대에서 발달한 독특한 형태의 해상 제국 체제입니다. 해양 제국의 경제는 노예를 동원한 소금 채굴에 의존하지만, 일반 민중이 선호하는 체제는 아닙니다."
 game_concept_maritime: "해양 제국"
 game_concept_maritime_desc: "$maritime_government_desc$"
 proletarian_government: "프롤레타리아 독재제"
 proletarian_government_with_icon: "@government_type_republic! $proletarian_government$"
 proletarian_government_adjective: "프롤레타리아 독재제"
 proletarian_government_realm: "프롤레타리아 독재정"
 proletarian_government_vassals_label: "프롤레타리아 독재제"
 proletarian_government_desc: "프롤레타리아 독재정 [government_form|E]은 공산주의 이데올로기에 근거한 노동계급의 독재를 표방합니다. 이론상 모든 권력은 프롤레타리아트 계급(과 그 동맹 계급들)에게 귀속되며, 이들의 대표로써 전위당이 국가를 통치합니다. 적어도 그렇게 주장하고 있습니다."
 game_concept_proletarian: "프롤레타리아 독재제"
 game_concept_proletarian_desc: "$proletarian_government_desc$"
 secular_republic_government: "인민 공화국"
 secular_republic_government_with_icon: "@government_type_republic! $secular_republic_government$"
 secular_republic_government_adjective: "인민 공화제"
 secular_republic_government_realm: "인민 공화국"
 secular_republic_government_vassals_label: "인민 공화제"
 secular_republic_government_desc: "인민 공화국 [government_form|E]는 평양에서 조선인민공화국이 선포되었을 때 등장하였습니다. 보통의 공화국이나 평의회 공화국과 구분되는 정치 체제입니다. 국가의 지도자는 정기적으로 선거를 통해 뽑히게 되며, 이를 통해 민주적 정당성을 부여받습니다. 각 지역의 대표자들이 선거인단을 보내면, 그 선거인단이 표를 행사합니다."
 game_concept_secular_republic: "세속 공화정"
 game_concept_secular_republic_desc: "$secular_republic_government_desc$"
 merchant_republic_government: "상인 공화제"
