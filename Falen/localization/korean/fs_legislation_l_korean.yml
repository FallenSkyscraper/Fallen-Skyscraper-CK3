l_korean:
 FS_LEGISLATION_TITLE: "국회 법률 및 의안"
 FS_LEGISLATION_PROCEDURE: "대통령과 현직 의원이 안건을 발의합니다. 90일간 숙의한 뒤 14일간 표결하며, 결원은 재적수에 포함하지 않습니다. 투옥·미성년·행동 불능인 의원은 재적에 남지만 표결할 수 없습니다."
 FS_LEGISLATION_READ_ONLY: "대통령과 현직 의원만 발의·설득·표결 등 의정활동에 참여할 수 있습니다."
 FS_LEGISLATION_MARTIAL_ACTIVE: "현재 대통령의 비상계엄이 시행 중입니다. 국회는 해제요구안을 의결할 수 있습니다."
 FS_LEGISLATION_DECLARE_MARTIAL: "비상계엄 선포"
 FS_LEGISLATION_CURRENT: "현재 심의 중인 안건"
 FS_LEGISLATION_KIND_LAW: "교리 개정 법률안"
 FS_LEGISLATION_KIND_IMPEACHMENT: "대통령 탄핵소추안"
 FS_LEGISLATION_KIND_LIFT_MARTIAL_LAW: "비상계엄 해제요구안"
 FS_LEGISLATION_KIND_CENSURE: "국회의원 징계안"
 FS_LEGISLATION_KIND_EXPULSION: "국회의원 제명안"
 FS_LEGISLATION_PROPOSER: "발의자: [GetTitleByKey( 'k_koreanism' ).MakeScope.Var( 'fs_legislation_proposer' ).Char.GetShortUIName]"
 FS_LEGISLATION_TARGET: "대상: [GetTitleByKey( 'k_koreanism' ).MakeScope.Var( 'fs_legislation_target' ).Char.GetShortUIName]"
 FS_LEGISLATION_STAGE_DEBATE: "#high 숙의 중#! · 남은 기간 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_days_left_value' )|0]일\n의원들의 예상 지지 성향을 살피고, 개별 의원을 설득할 수 있습니다."
 FS_LEGISLATION_STAGE_VOTE: "#high 본회의 표결 중#! · 남은 기간 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_days_left_value' )|0]일\n본인의 찬성·반대·기권을 선택할 수 있습니다. 기권과 미투표는 찬성표에 포함되지 않습니다."
 FS_LEGISLATION_STAGE_PRESIDENTIAL: "#high 대통령 심사 중#! · 남은 기간 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_days_left_value' )|0]일\n대통령은 법률안을 공포하거나 한 차례 재의를 요구할 수 있습니다. 기한이 지나면 자동으로 공포됩니다."
 FS_LEGISLATION_STAGE_REVOTE: "#high 재의결 표결 중#! · 남은 기간 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_days_left_value' )|0]일\n재적의원 3분의 2 이상이 찬성하면 대통령의 추가 거부 없이 법률이 제정됩니다."
 FS_LEGISLATION_QUORUM: "재적 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_enrolled_value' )|0]명 · 가결에 필요한 찬성 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_threshold_value' )|0]표"
 FS_LEGISLATION_TALLY: "찬성 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_yes_value' )|0] · 반대 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_no_value' )|0] · 기권·미투표·표결 불가 [GetTitleByKey( 'k_koreanism' ).MakeScope.ScriptValue( 'fs_legislation_abstain_value' )|0]"
 FS_LEGISLATION_VOTE_YES: "찬성"
 FS_LEGISLATION_VOTE_NO: "반대"
 FS_LEGISLATION_VOTE_ABSTAIN: "기권"
 FS_LEGISLATION_PROMULGATE: "법률안 공포"
 FS_LEGISLATION_VETO: "재의요구"
 FS_LEGISLATION_PROPOSE_TITLE: "새 안건 발의"
 FS_LEGISLATION_LAW_HINT: "아래 교리를 선택하면 해당 교리로 개정하는 법률안을 발의합니다. 현재 모든 교파에 적용 중인 교리와 교리 간 조건에 맞지 않는 안건은 발의할 수 없습니다. 일반 법률안은 재적 과반수 찬성으로 의결됩니다."
 FS_LEGISLATION_PROPOSE_IMPEACHMENT: "대통령 탄핵소추안 발의"
 FS_LEGISLATION_PROPOSE_IMPEACHMENT_TT: "#T 대통령 탄핵소추안 발의#!\n재적의원 3분의 2 이상이 찬성하면 대통령은 즉시 파면되어 보유한 모든 작위에서 물러납니다. 대통령의 재의요구 대상이 아닙니다.\n\n[GetScriptedGui( 'fs_legislation_propose_impeachment_gui' ).IsValidTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 FS_LEGISLATION_PROPOSE_LIFT_MARTIAL: "계엄 해제요구안 발의"
 FS_LEGISLATION_LAST_RESULT: "최근 종결 안건"
 FS_LEGISLATION_RESULT_ENACTED: "법률이 제정되어 한국교 전체 교파의 교리가 개정되었습니다."
 FS_LEGISLATION_RESULT_REJECTED: "필요한 찬성표를 얻지 못해 안건이 부결되었습니다."
 FS_LEGISLATION_RESULT_IMPEACHED: "탄핵소추안이 가결되어 대통령이 즉시 파면되고 보유한 모든 작위에서 물러났습니다."
 FS_LEGISLATION_RESULT_MARTIAL_LAW_LIFTED: "계엄 해제요구안이 가결되어 비상계엄이 해제되었습니다."
 FS_LEGISLATION_RESULT_CENSURED: "징계안이 가결되어 대상 의원에게 징계가 적용되었습니다. 의원직은 유지됩니다."
 FS_LEGISLATION_RESULT_EXPELLED: "제명안이 가결되어 대상 의원의 의원직이 박탈되었습니다. 지방 공직 등 별도 직위는 유지됩니다."
 FS_LEGISLATION_RESULT_LAPSED: "대상이 더 이상 해당 직위에 있지 않거나 안건의 적용 조건이 사라져 안건이 종결되었습니다."
 FS_LEGISLATION_LAST_TALLY: "종결 당시 재적 [GetTitleByKey( 'k_koreanism' ).MakeScope.Var( 'fs_legislation_last_enrolled' ).GetValue|0]명 · 필요 찬성 [GetTitleByKey( 'k_koreanism' ).MakeScope.Var( 'fs_legislation_last_threshold' ).GetValue|0]표\n찬성 [GetTitleByKey( 'k_koreanism' ).MakeScope.Var( 'fs_legislation_last_yes' ).GetValue|0] · 반대 [GetTitleByKey( 'k_koreanism' ).MakeScope.Var( 'fs_legislation_last_no' ).GetValue|0] · 기권·미투표·표결 불가 [GetTitleByKey( 'k_koreanism' ).MakeScope.Var( 'fs_legislation_last_abstain' ).GetValue|0]"
 FS_LEGISLATION_MEMBERS_TITLE: "의원별 의정활동"
 FS_LEGISLATION_MEMBERS_HINT: "숙의와 표결 중에는 의원의 찬성 또는 반대 성향을 설득할 수 있습니다. 설득을 시도하면 7일간 다시 설득할 수 없으며 외교력에 따라 효과가 달라집니다. 징계·제명안의 발의 대상도 이 목록에서 선택합니다. 탄핵과 제명에는 재적의원 3분의 2 이상 찬성이 필요합니다."
 FS_LEGISLATION_MEMBER_RITE: "[Character.GetRite.GetName]"
 FS_LEGISLATION_MEMBER_SUPPORT: "찬성 성향: [Character.MakeScope.ScriptValue( 'fs_legislation_support_score_value' )|+0]"
 FS_LEGISLATION_MEMBER_BALLOT_YES: "표결: #P 찬성#!"
 FS_LEGISLATION_MEMBER_BALLOT_NO: "표결: #N 반대#!"
 FS_LEGISLATION_MEMBER_BALLOT_ABSTAIN: "표결: 기권"
 FS_LEGISLATION_MEMBER_BALLOT_PENDING: "표결: 미투표"
 FS_LEGISLATION_MEMBER_BALLOT_UNAVAILABLE: "표결 불가: 투옥·미성년·행동 불능 상태"
 FS_LEGISLATION_NOTICE_PROPOSED: "국회에 새 안건이 발의됨"
 FS_LEGISLATION_NOTICE_VOTE: "국회 본회의 표결 개시"
 FS_LEGISLATION_NOTICE_PRESIDENTIAL: "의결된 법률안이 대통령에게 이송됨"
 FS_LEGISLATION_NOTICE_REVOTE: "대통령의 재의요구로 재표결 개시"
 FS_LEGISLATION_NOTICE_RESULT: "국회 안건 처리 완료"
 FS_LEGISLATION_NOTICE_FINISHED: "$FS_LEGISLATION_NOTICE_RESULT$"
 FS_LEGISLATION_NOTICE_INSTRUCTION: "국회 창의 법률 및 의안 탭에서 안건과 남은 기간을 확인하십시오. 숙의 중에는 의원을 설득하고, 표결 중에는 본인의 찬성·반대·기권을 선택할 수 있습니다. 대통령은 의결된 법률안을 공포하거나 재의를 요구할 수 있습니다."
 FS_LEGISLATION_NOTICE_DESC: "$FS_LEGISLATION_NOTICE_INSTRUCTION$"
 FS_LEGISLATION_LOBBY_YES: "찬성 설득"
 FS_LEGISLATION_LOBBY_NO: "반대 설득"
 FS_LEGISLATION_PROPOSE_CENSURE: "징계안 발의"
 FS_LEGISLATION_PROPOSE_EXPULSION: "제명안 발의"
 FS_LEGISLATION_NO_MEMBERS: "재직 중인 의원이 없습니다."
 FS_LEGISLATION_LOBBY_COOLDOWN_TT: "설득은 7일에 한 번만 시도할 수 있습니다."
 fs_legislation_censure_modifier: "국회 징계"
 fs_legislation_censure_modifier_desc: "국회의 의결로 징계를 받은 공직자입니다. 의원직은 유지하지만 명예와 신도들의 신뢰가 손상되었습니다."
 fs_legislation_martial_law_modifier: "비상계엄"
 fs_legislation_martial_law_modifier_desc: "대통령이 비상계엄을 선포했습니다. 비상 권한의 행사는 신도들 사이에서 경계와 불만을 낳습니다."
 FS_LEGISLATION_LAW_REQUIREMENTS_TT: "진행 중인 안건이 없으며, 활동 가능한 대통령 또는 현직 의원이 아직 적용되지 않은 호환 가능한 교리 개정안을 발의해야 합니다."
 FS_LEGISLATION_IMPEACHMENT_REQUIREMENTS_TT: "진행 중인 안건이 없고, 활동 가능한 현직 의원이 재직 중인 대통령의 탄핵을 발의해야 합니다."
 FS_LEGISLATION_LIFT_MARTIAL_REQUIREMENTS_TT: "진행 중인 안건이 없고 비상계엄이 시행 중일 때 활동 가능한 대통령 또는 현직 의원이 발의할 수 있습니다."
 FS_LEGISLATION_MEMBER_MOTION_REQUIREMENTS_TT: "진행 중인 안건이 없고, 활동 가능한 대통령 또는 현직 의원이 본인이 아닌 현직 의원을 대상으로 발의해야 합니다."
 FS_LEGISLATION_BALLOT_REQUIREMENTS_TT: "본회의 또는 재의결 표결 기간이 남아 있어야 하며, 투옥·미성년·행동 불능 상태가 아닌 현직 의원만 투표할 수 있습니다."
 FS_LEGISLATION_LOBBY_REQUIREMENTS_TT: "활동 가능한 대통령 또는 현직 의원이 숙의·표결 중 활동 가능한 다른 의원을 대상으로 7일에 한 번 설득할 수 있습니다."
 FS_LEGISLATION_PROMULGATE_REQUIREMENTS_TT: "활동 가능한 현직 대통령만 심사 기간이 남은 의결된 법률안을 공포할 수 있습니다."
 FS_LEGISLATION_VETO_REQUIREMENTS_TT: "활동 가능한 현직 대통령만 심사 기간이 남은 의결된 법률안에 한 차례 재의를 요구할 수 있습니다."
 FS_LEGISLATION_DECLARE_MARTIAL_REQUIREMENTS_TT: "활동 가능한 현직 대통령만 비상계엄이 시행되고 있지 않을 때 선포할 수 있습니다."
