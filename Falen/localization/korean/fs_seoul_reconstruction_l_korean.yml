l_korean:
 fs_seoul_reconstruction_region: "서울 재건 지역"
 fs_seoul_old_world_ruins_modifier: "구시대 건물들 잔해"
 fs_seoul_old_world_ruins_modifier_desc: "구시대의 고층건물들이 무너진 채 남아 있습니다. 잔해는 군대의 보급과 여행을 방해하지만, 방어군에게는 엄폐물과 익숙한 전장을 제공합니다."
 fs_seoul_development_restriction_modifier: "개발제한구역"
 fs_seoul_development_restriction_modifier_desc: "무너진 도시의 지반과 기반시설을 정비하기 전까지 새로운 개발이 제한됩니다. 마천루 재건의 기반 닦기를 완공하면 해제됩니다."
 fs_seoul_reconstruction_stage_0_tt: "이 구에서 아직 마천루 재건을 시작하지 않음"
 fs_seoul_reconstruction_stage_1_tt: "이 구의 과거의 잔해 청소가 완공됨"
 fs_seoul_reconstruction_stage_2_tt: "이 구의 기반 닦기가 완공됨"
 fs_seoul_reconstruction_stage_3_tt: "이 구의 설계하기가 완공됨"
 fs_seoul_no_other_skyscraper_project_tt: "이 구에서 다른 마천루 재건 단계가 진행 중이지 않음"
 fs_seoul_university_foundations_required_tt: "이 구의 기반 닦기가 완공되어 개발제한구역이 해제됨"
 fs_seoul_university_project_required_tt: "특별시 정부에서는 서울시장이 개시하는 대학 재건 대규모 사업을 통해 건설해야 함"
 fs_seoul_skyscraper_restoration_unlocked_tt: "이 구에서 마천루 복구 사업을 시작할 수 있음"
 fs_seoul_project_rules_desc: "서울시장이 사업을 개시하며 구청장도 각 항목에 기여할 수 있습니다. 필수 기여를 모두 조달하면 공사가 시작되고, 완공 시 시장과 각 항목의 기여자가 영향력을 얻습니다."
 building_type_seoul_metropolis_02: "서울"
 building_seoul_metropolis_02: "재건된 마천루"
 building_seoul_metropolis_02_desc: "잔해를 조사하고 치운 자리에 다시 높은 건물들이 들어섰습니다. 보강된 기반시설과 복원된 마천루는 서울의 새로운 번영을 이끕니다."
 great_project_type_fs_seoul_skyscraper_clearance: "마천루 재건: 과거의 잔해 청소"
 great_project_type_fs_seoul_skyscraper_clearance_desc: "무너진 고층건물 아래에는 구시대의 기록과 위험물이 함께 묻혀 있다. 잔해를 조사하고 안전하게 치워 도시 재건의 첫걸음을 내딛는다.\n\n$fs_seoul_project_rules_desc$"
 great_project_type_tooltip_fs_seoul_skyscraper_clearance: "$great_project_type_fs_seoul_skyscraper_clearance_desc$"
 great_project_name_fs_seoul_skyscraper_clearance: "[PROVINCE.GetNameNoTooltip] 마천루 재건: 과거의 잔해 청소"
 great_project_name_possessive_fs_seoul_skyscraper_clearance: "$great_project_name_fs_seoul_skyscraper_clearance$의"
 great_project_type_fs_seoul_skyscraper_clearance_contribution_ruins_survey: "잔해 조사"
 great_project_type_fs_seoul_skyscraper_clearance_contribution_ruins_survey_desc: "구시대의 건물과 매몰된 기록을 조사하고 철거 구역을 정한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_clearance_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_clearance_contribution_hazard_removal: "위험물 제거"
 great_project_type_fs_seoul_skyscraper_clearance_contribution_hazard_removal_desc: "붕괴 위험이 있는 구조물과 남겨진 위험물을 제거한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_clearance_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_clearance_contribution_debris_clearance: "잔해 반출"
 great_project_type_fs_seoul_skyscraper_clearance_contribution_debris_clearance_desc: "폐기물과 재사용할 자재를 분류하고 잔해를 도시 밖으로 반출한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_clearance_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_foundations: "마천루 재건: 기반 닦기"
 great_project_type_fs_seoul_skyscraper_foundations_desc: "잔해를 걷어낸 땅 위에 다시 도시의 기반을 마련한다. 지반과 기반시설 정비가 끝나면 개발제한구역을 해제하고 대학 재건도 추진할 수 있다.\n\n$fs_seoul_project_rules_desc$"
 great_project_type_tooltip_fs_seoul_skyscraper_foundations: "$great_project_type_fs_seoul_skyscraper_foundations_desc$"
 great_project_name_fs_seoul_skyscraper_foundations: "[PROVINCE.GetNameNoTooltip] 마천루 재건: 기반 닦기"
 great_project_name_possessive_fs_seoul_skyscraper_foundations: "$great_project_name_fs_seoul_skyscraper_foundations$의"
 great_project_type_fs_seoul_skyscraper_foundations_contribution_ground_survey: "지반 조사"
 great_project_type_fs_seoul_skyscraper_foundations_contribution_ground_survey_desc: "과거 건물의 지하 구조와 지반 상태를 조사한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_foundations_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_foundations_contribution_ground_reinforcement: "지반 보강"
 great_project_type_fs_seoul_skyscraper_foundations_contribution_ground_reinforcement_desc: "새로운 고층건물의 무게를 견딜 수 있도록 지반과 기초를 보강한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_foundations_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_foundations_contribution_infrastructure: "기반시설 정비"
 great_project_type_fs_seoul_skyscraper_foundations_contribution_infrastructure_desc: "도로와 배수로, 급수 시설을 복구해 재건 부지를 연결한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_foundations_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_design: "마천루 재건: 설계하기"
 great_project_type_fs_seoul_skyscraper_design_desc: "옛 도시의 설계도와 지금의 기술을 맞추어 새로운 마천루를 설계한다. 구조와 시공 계획이 완성되면 마천루 복구에 착수할 수 있다.\n\n$fs_seoul_project_rules_desc$"
 great_project_type_tooltip_fs_seoul_skyscraper_design: "$great_project_type_fs_seoul_skyscraper_design_desc$"
 great_project_name_fs_seoul_skyscraper_design: "[PROVINCE.GetNameNoTooltip] 마천루 재건: 설계하기"
 great_project_name_possessive_fs_seoul_skyscraper_design: "$great_project_name_fs_seoul_skyscraper_design$의"
 great_project_type_fs_seoul_skyscraper_design_contribution_old_blueprints: "고대 설계도 복원"
 great_project_type_fs_seoul_skyscraper_design_contribution_old_blueprints_desc: "파손된 도면과 기록을 모아 옛 마천루의 설계를 복원한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_design_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_design_contribution_structural_design: "구조 설계"
 great_project_type_fs_seoul_skyscraper_design_contribution_structural_design_desc: "남아 있는 기술과 자재에 맞춰 안전한 고층건물의 구조를 설계한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_design_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_design_contribution_construction_plan: "공정 계획"
 great_project_type_fs_seoul_skyscraper_design_contribution_construction_plan_desc: "장인과 인부, 자재 수송을 조율할 장기 공사 계획을 세운다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_design_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_restoration: "마천루 재건: 마천루 복구"
 great_project_type_fs_seoul_skyscraper_restoration_desc: "서울의 하늘에 다시 높은 건물을 세운다. 장기간에 걸친 복구가 끝나면 구시대의 잔해 위에 새로운 번영의 상징이 들어선다.\n\n$fs_seoul_project_rules_desc$"
 great_project_type_tooltip_fs_seoul_skyscraper_restoration: "$great_project_type_fs_seoul_skyscraper_restoration_desc$"
 great_project_name_fs_seoul_skyscraper_restoration: "[PROVINCE.GetNameNoTooltip] 마천루 재건: 마천루 복구"
 great_project_name_possessive_fs_seoul_skyscraper_restoration: "$great_project_name_fs_seoul_skyscraper_restoration$의"
 great_project_type_fs_seoul_skyscraper_restoration_contribution_structure: "구조체 복구"
 great_project_type_fs_seoul_skyscraper_restoration_contribution_structure_desc: "마천루를 지탱할 기둥과 바닥, 외벽의 구조체를 세운다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_restoration_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_restoration_contribution_utilities: "설비 복구"
 great_project_type_fs_seoul_skyscraper_restoration_contribution_utilities_desc: "고층건물의 급수와 배수, 운반과 안전 설비를 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_restoration_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_skyscraper_restoration_contribution_facade: "외장 복구"
 great_project_type_fs_seoul_skyscraper_restoration_contribution_facade_desc: "건물의 외장을 완성하고 시민들이 사용할 공간을 정비한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_restoration_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_seoul_national_university: "특별 프로젝트: 서울대학교"
 great_project_type_fs_seoul_restore_seoul_national_university_desc: "관악산의 옛 대학을 다시 연다. 인문대학, 사회과학대학, 자연과학대학, 공과대학(아래), 공과대학(위), 예술대학, 법과대학에 자유로운 순서로 기여하고 모두 조달한 뒤 서울대학교를 통합 완공한다.\n\n$fs_seoul_project_rules_desc$"
 great_project_type_tooltip_fs_seoul_restore_seoul_national_university: "$great_project_type_fs_seoul_restore_seoul_national_university_desc$"
 great_project_name_fs_seoul_restore_seoul_national_university: "[PROVINCE.GetNameNoTooltip] 특별 프로젝트: 서울대학교"
 great_project_name_possessive_fs_seoul_restore_seoul_national_university: "$great_project_name_fs_seoul_restore_seoul_national_university$의"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_humanities: "인문대학"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_humanities_desc: "인문대학의 강의실과 연구 공간을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_national_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_social_sciences: "사회과학대학"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_social_sciences_desc: "사회과학대학의 강의실과 연구 공간을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_national_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_natural_sciences: "자연과학대학"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_natural_sciences_desc: "자연과학대학의 강의실과 연구 공간을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_national_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_engineering_lower: "공과대학(아래)"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_engineering_lower_desc: "공과대학(아래)의 강의실과 연구 공간을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_national_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_engineering_upper: "공과대학(위)"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_engineering_upper_desc: "공과대학(위)의 강의실과 연구 공간을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_national_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_arts: "예술대학"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_arts_desc: "음악대학과 미술대학을 통합한 예술대학의 교육 공간을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_national_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_law: "법과대학"
 great_project_type_fs_seoul_restore_seoul_national_university_contribution_law_desc: "법과대학의 강의실과 연구 공간을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_national_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_yonsei_university: "특별 프로젝트: 연세대학교"
 great_project_type_fs_seoul_restore_yonsei_university_desc: "연세대학교의 강의동과 도서관을 복구하고 학자들을 모아 교육과 연구를 다시 시작한다.\n\n$fs_seoul_project_rules_desc$"
 great_project_type_tooltip_fs_seoul_restore_yonsei_university: "$great_project_type_fs_seoul_restore_yonsei_university_desc$"
 great_project_name_fs_seoul_restore_yonsei_university: "[PROVINCE.GetNameNoTooltip] 특별 프로젝트: 연세대학교"
 great_project_name_possessive_fs_seoul_restore_yonsei_university: "$great_project_name_fs_seoul_restore_yonsei_university$의"
 great_project_type_fs_seoul_restore_yonsei_university_contribution_lecture_halls: "강의동 복구"
 great_project_type_fs_seoul_restore_yonsei_university_contribution_lecture_halls_desc: "옛 강의동을 복구하고 학생들이 공부할 공간을 마련한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_yonsei_university_contribution_library: "도서관 복구"
 great_project_type_fs_seoul_restore_yonsei_university_contribution_library_desc: "흩어진 장서와 기록을 수집하고 도서관을 복구한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_yonsei_university_contribution_faculty: "교수진 확보"
 great_project_type_fs_seoul_restore_yonsei_university_contribution_faculty_desc: "학자와 장인을 초빙해 대학의 교육과 연구를 다시 시작할 준비를 한다.\n\n사업 완공 시 이 항목의 기여자는 [influence|E] [GetPlayer.MakeScope.ScriptValue('fs_seoul_university_contributor_influence_value')|0]을 얻습니다."
 great_project_type_fs_seoul_restore_korea_university: "특별 프로젝트: 고려대학교"
 great_project_type_fs_seoul_restore_korea_university_desc: "고려대학교의 강의동과 도서관을 복구하고 학자들을 모아 교육과 연구를 다시 시작한다.\n\n$fs_seoul_project_rules_desc$"
 great_project_type_tooltip_fs_seoul_restore_korea_university: "$great_project_type_fs_seoul_restore_korea_university_desc$"
 great_project_name_fs_seoul_restore_korea_university: "[PROVINCE.GetNameNoTooltip] 특별 프로젝트: 고려대학교"
 great_project_name_possessive_fs_seoul_restore_korea_university: "$great_project_name_fs_seoul_restore_korea_university$의"
 great_project_type_fs_seoul_restore_korea_university_contribution_lecture_halls: "강의동 복구"
