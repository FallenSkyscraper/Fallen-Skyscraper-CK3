l_korean:
 fs_appoint_parliament_member_interaction: "국회의원 임명"
 fs_appoint_parliament_member_interaction_desc: "비례대표 공석을 선택하여 [recipient.GetShortUINameNoTooltip](을)를 국회의원으로 임명합니다.\n\n$fs_parliament_dual_office_appointment_rules_tt$\n$fs_parliament_dual_office_entry_claims_tt$"
 fs_appoint_parliament_member_interaction_notification: "당신을 비례대표 국회의원으로 임명하고자 합니다."
 fs_dismiss_parliament_member_interaction: "국회의원 해임"
 fs_dismiss_parliament_member_interaction_desc: "대통령의 국회의원 해임은 현재 허용되지 않습니다."
 fs_parliament_dismissal_disabled_tt: "국회의원 해임은 현재 허용되지 않습니다."
 fs_parliament_candidate_tt: "후보자는 한국교를 믿는 활동 가능한 성인이며, 대통령이나 현직 국회의원이 아니어야 합니다."
 fs_parliament_vacancy_tt: "임명할 수 있는 비례대표 공석이 있어야 합니다."
 fs_parliament_selected_vacancy_tt: "임명할 수 있는 비례대표 공석을 선택해야 합니다."
 fs_parliament_fixed_seat_creation_tt: "지역구 의석은 선거 활동으로, 비례대표 의석은 대통령의 임명으로 채웁니다."
 fs_parliament_fixed_seat_destruction_tt: "고정된 국회의원 의석은 폐지할 수 없습니다."
 fs_request_parliament_seat_desc: "대통령에게 비례대표 국회의원 임명을 요청합니다. 수락되면 비례대표 공석 중 하나를 배정받습니다.\n\n$fs_parliament_dual_office_appointment_rules_tt$\n$fs_parliament_dual_office_entry_claims_tt$"
 fs_request_parliament_seat_notification: "비례대표 국회의원으로 임명해 주실 것을 요청합니다."
 fs_request_parliament_seat_accept_tt: "비례대표 공석 중 하나를 배정받아 국회의원이 됩니다."
 fs_request_parliament_seat_base_reason: "의원직 요청에 대한 판단: $VALUE|=+0$"
 fs_parliament_dual_office_appointment_allowed_tt: "의원 겸직 금지법에 따라 세속 영지를 보유한 인물을 임명할 수 없습니다. 헌정 정부 인물과 한국교 지역 공직자는 이 제한에서 제외됩니다."
 fs_parliament_dual_office_entry_claims_tt: "영지를 보유한 인물은 의원직을 받기 전에 기존 최우선 후계자에게 직접 보유한 작위의 압박 명분을 남깁니다. 후계자가 없거나 명분을 허용하지 않는 작위는 제외됩니다."
 fs_parliament_dual_office_appointment_rules_tt: "겸직이 허용되면 기존 영지를 유지하면서 헌정 정부로 전환되어 영지가 국유·신정 승계에 묶입니다. 겸직이 금지되면 세속 영주를 임명할 수 없습니다. 이미 헌정 정부인 인물과 한국교 지역 공직자는 예외입니다."
 fs_parliament_dual_office_election_rules_tt: "당선 당시 겸직이 금지되어 있으면 세속 영주는 기존 승계법에 따라 퇴위한 뒤 의원직을 받습니다. 겸직이 허용되면 기존 영지를 유지하지만 헌정 정부로 전환되어 영지가 국유·신정 승계에 묶입니다. 이미 헌정 정부인 인물과 한국교 지역 공직자는 퇴위하지 않습니다."
