l_korean:
 fs_appoint_parliament_member_interaction: "국회의원 임명"
 fs_appoint_parliament_member_interaction_desc: "기존의 공석을 선택하여 [recipient.GetShortUINameNoTooltip](을)를 국회의원으로 임명합니다. 새로운 의석은 생성되지 않습니다."
 fs_appoint_parliament_member_interaction_notification: "당신을 국회의원으로 임명하고자 합니다."
 fs_dismiss_parliament_member_interaction: "국회의원 해임"
 fs_dismiss_parliament_member_interaction_desc: "[recipient.GetShortUINameNoTooltip](을)를 국회의원에서 해임합니다. 의석은 공석으로 남으며, 지역 대표직과 다른 작위는 유지됩니다."
 fs_parliament_candidate_tt: "후보자는 한국교를 믿는 활동 가능한 성인이며, 대통령이나 현직 국회의원이 아니어야 합니다."
 fs_parliament_vacancy_tt: "선거가 진행 중이지 않은 국회의원 공석이 있어야 합니다."
 fs_parliament_selected_vacancy_tt: "선거가 진행 중이지 않은 국회의원 공석을 선택해야 합니다."
 fs_parliament_fixed_seat_creation_tt: "국회의원 의석은 대통령의 임명으로 채우며, 지역구 공석은 주민 선거로도 채울 수 있습니다."
 fs_parliament_fixed_seat_destruction_tt: "고정된 국회의원 의석은 폐지할 수 없습니다. 해임하면 공석으로 남습니다."
 fs_request_parliament_seat_desc: "대통령에게 국회의원 임명을 요청합니다. 수락되면 기존 의석의 공석 중 하나를 배정받습니다."
 fs_request_parliament_seat_notification: "국회의원으로 임명해 주실 것을 요청합니다."
 fs_request_parliament_seat_accept_tt: "기존 공석 중 하나를 배정받아 국회의원이 됩니다."
 fs_request_parliament_seat_base_reason: "의원직 요청에 대한 판단: $VALUE|=+0$"
