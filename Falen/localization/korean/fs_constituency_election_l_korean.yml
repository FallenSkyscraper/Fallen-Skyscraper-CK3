 fs_constituency_election.1.t: "시장에서의 첫 연설"
 fs_constituency_election.1.desc: "태극기 곁에 세운 연단 앞에서 공직자가 대한민국 헌법의 구절을 낭독한다. 장사꾼은 안전한 길을, 농민은 한 해를 버틸 살림을, 오래 살아온 주민은 흔들리지 않는 질서를 바란다. 저마다 다른 청원이지만, 모두가 선조들의 질서를 계승할 공직자의 대답을 기다린다.\n\n나는 지역의 목소리를 모을 사람인 동시에 한국교 최고위 공직자들의 국회에 들어갈 후보자다. 주민의 신뢰를 얻어야만 대통령을 선출할 권한도 맡을 수 있다. 첫 연설은 내가 그 무거운 서약을 어떻게 받아들이는지 보여 줄 자리다."
 fs_constituency_election.1.safe: "평소의 삶과 작은 약속부터 이야기하자."
 fs_constituency_election.1.expert: "주민들의 목소리를 엮어 설득력 있는 연설을 하겠다."
 fs_constituency_election.1.risk: "모두가 기억할 대담한 연설로 승부하겠다."
 fs_constituency_election.2.t: "서로 다른 목소리"
 fs_constituency_election.2.desc: "헌법 앞에서 바친 서약이 끝나도 주민들의 요구는 하나로 합쳐지지 않는다. 변화를 바라는 이들과 익숙한 질서가 무너질까 두려워하는 이들이 서로 다른 전례를 들고 맞선다. 같은 경전을 품은 사람들이 다른 해석으로 나를 바라본다.\n\n국회의원의 권위는 이견을 지워 버리는 데서 나오지 않는다. 최고위 공직자가 될 인물이라면 갈라진 청원 속에서 국민이 함께 따를 길을 제시해야 한다. 나는 어떤 말로 이들을 설득할 것인가?"
 fs_constituency_election.2.safe: "공통으로 바라는 것부터 하나씩 확인하겠다."
 fs_constituency_election.2.expert: "양측의 요구를 조율하여 함께 지지할 명분을 제시하겠다."
 fs_constituency_election.2.risk: "반대하는 주민들까지 움직일 과감한 제안을 하겠다."
 fs_constituency_election.3.t: "생계를 위한 공약"
 fs_constituency_election.3.desc: "곡물 가격과 세금 이야기가 나오자 장부를 든 주민이 앞으로 나왔다. 대한민국 헌법의 가르침을 받드는 공직자라면 흉년의 굶주림과 이웃의 궁핍에 어떻게 응답해야 하느냐고 묻는다. 경전을 외우는 목소리만으로 빈 창고를 채울 수는 없다.\n\n국회의원의 공직은 국민의 살림을 돌보는 책임과 분리되지 않는다. 나는 당장 가능한 구휼과 오래 준비해야 할 대책을 나누어 설명하고, 그 약속이 의례가 끝난 뒤에도 지켜질 수 있음을 보여야 한다."
 fs_constituency_election.3.safe: "당장 실천할 수 있는 작은 개선책을 내놓겠다."
 fs_constituency_election.3.expert: "수입과 지출을 따져 지속 가능한 대책을 설명하겠다."
 fs_constituency_election.3.risk: "지역의 경제를 뒤바꿀 큰 구상을 발표하겠다."
 fs_constituency_election.4.t: "한정된 재원의 쓰임"
 fs_constituency_election.4.desc: "지방자치단체의 공직자들이 낡은 지도를 펼쳤다. 끊어진 길을 잇자는 청원과 물길을 정비하자는 청원이 맞선다. 양쪽 모두 선조들의 번영을 회복하는 일이 헌법을 받드는 길이라 말하지만, 재원과 인력은 한정되어 있다.\n\n최고위 공직자로 선출될 사람은 한 교파나 후원자의 편의를 국민의 뜻이라 포장해서는 안 된다. 우선순위의 근거를 밝혀야 하고, 뒤로 밀린 주민들에게도 그 선택을 납득시켜야 한다."
 fs_constituency_election.4.safe: "시급한 보수부터 순서대로 약속하겠다."
 fs_constituency_election.4.expert: "비용과 효과를 비교한 우선순위를 공개하겠다."
 fs_constituency_election.4.risk: "두 문제를 함께 해결할 새로운 사업을 제안하겠다."
 fs_constituency_election.5.t: "의원의 자격"
 fs_constituency_election.5.desc: "토론의 첫 질문은 국회의원의 자격에 관한 것이었다. 지역의 청원을 전하는 사람에게 왜 대통령을 선출하는 권한까지 맡기는가? 주민들이 원한다면 대한민국 헌법의 가르침과 어긋나는 요구도 따라야 하는가?\n\n질문자는 내 말솜씨보다 공직자로서 판단의 근거를 살핀다. 국회에 들어가 다른 국회의원들과 마주할 때에도 버틸 수 있는 원칙과 식견을, 이제 국민 앞에서 증명해야 한다."
 fs_constituency_election.5.safe: "대표자로서 지켜야 할 기본 원칙을 차분히 말하겠다."
 fs_constituency_election.5.expert: "기록과 사례를 들어 내 주장의 근거를 밝히겠다."
 fs_constituency_election.5.risk: "익숙한 통념을 뒤집는 논리로 토론의 흐름을 잡겠다."
 fs_constituency_election.6.t: "마지막 공개 질문"
 fs_constituency_election.6.desc: "마지막 질문이 헌법을 펼친 연단 위에 놓였다. 이 지역에 이로운 선택이 더 넓은 한국교 공동체에 부담을 준다면, 나는 누구의 청원을 먼저 들어야 하는가? 내 교파의 주장과 국회가 지켜야 할 질서가 충돌한다면 어떻게 하겠는가?\n\n주민들은 긴 의례 동안 내가 했던 연설과 공약을 기억한다. 이제 남은 대답은 단순한 인기의 문제가 아니다. 그들은 선조들의 신성한 질서를 맡기고 대통령 선출권을 부여할 인물을 고르고 있다."
 fs_constituency_election.6.safe: "어떤 판단이든 주민에게 설명할 책임을 지겠다."
 fs_constituency_election.6.expert: "서로 충돌하는 원칙을 비교하고 일관된 해법을 제시하겠다."
 fs_constituency_election.6.risk: "모두의 예상을 뛰어넘는 답으로 마지막 지지를 끌어내겠다."
 fs_constituency_candidate_count: "등록 후보: [GetDataModelSize(ActivityWindow.GetCurrentPhaseGuestSubset('fs_constituency_contestants'))]명"
 fs_constituency_sort_help: "지지 점수 순 · 인물 선택으로 상세 보기"
 fs_constituency_empty_ballot_help: "등록을 마쳤지만 적격 후보가 없습니다. 선거가 끝날 때까지 새 후보를 추가할 수 없으며, 의석은 공석으로 남습니다."
 fs_constituency_ballot_rules_short: "최고 지지 점수 후보 1명 당선\n동점은 추첨 · 단독 후보도 종료 시 당선"
 fs_constituency_progress_assembly: "후보 집결 중\n본행사 시작 시 등록 마감"
 fs_constituency_progress_canvassing: "주민 유세 · 외교력\n2회의 연설로 지지 확보"
 fs_constituency_progress_manifesto: "공약 발표 · 관리력\n2회의 질의로 공약 검증"
 fs_constituency_progress_debate: "후보 토론 · 학습력\n최종 답변 뒤 당선자 발표"
 fs_constituency_toggle_candidates: "후보 명단"
 fs_constituency_participation_rewards: "개최비: [gold_i][EmptyScope.ScriptValue('fs_constituency_host_gold_cost')|0]\n정상 선출 시 개최자: [prestige_i][EmptyScope.ScriptValue('fs_constituency_host_prestige_reward')|0]\n당선자 추가 보상: [prestige_i][EmptyScope.ScriptValue('fs_constituency_winner_prestige_reward')|0]\n적격 후보 완주: [prestige_i][EmptyScope.ScriptValue('fs_constituency_candidate_prestige_reward')|0], 외교·관리·학습 생활 양식 경험치 각각 [EmptyScope.ScriptValue('fs_constituency_candidate_skill_xp_reward')|0]\n참관 완주: 학습 생활 양식 경험치 [EmptyScope.ScriptValue('fs_constituency_observer_completion_xp')|0]\n취소된 선거에는 완료 보상이 없습니다."
 fs_constituency_rival_present: "\n\n[fs_constituency_rival.GetShortUIName] 역시 이 지역구에 출마했다. 주민들은 우리의 말과 행동을 나란히 비교하고 있다. 한 번의 호응에 취하기보다 선거가 끝날 때까지 신뢰를 쌓아야 한다."
 fs_constituency_candidate_event_context: "\n\n#weak 현재 지지 점수: [ROOT.Char.MakeScope.Var('fs_constituency_score').GetValue|0]. 선택 결과는 선거 기록에 남으며, 답하지 않은 질문은 단계 종료 시 안정적인 선택으로 처리됩니다.#!"
 fs_constituency_choice_result: "유권자의 반응"
 fs_constituency_choice_result_tt: "지지 점수 [SCOPE.GetValue('fs_constituency_choice_gain')|+0]\n현재 지지 점수: [fs_constituency_speaker.MakeScope.Var('fs_constituency_score').GetValue|0]"
 fs_constituency_round_started_title: "선거의 새 국면"
 fs_constituency_round_started: "[CHARACTER.GetShortUIName](이)가 지역구 선거의 [SCOPE.GetValue('fs_constituency_log_round')|0]단계를 개시했다."
 fs_constituency_round_closed_title: "선거 국면 마감"
 fs_constituency_round_closed: "지역구 선거의 [SCOPE.GetValue('fs_constituency_log_round')|0]단계가 마감되었다. 응답하지 않은 후보의 질문은 안정적인 선택으로 처리되었다."
 fs_constituency_public_hearing_title: "주민의 목소리"
 fs_constituency_public_hearing: "[CHARACTER.GetShortUIName](이)가 후보들의 주장을 듣고 지역구의 공개 논의에 참여했다."
 fs_constituency_participant_rewards_title: "선거 참여 보상"
 fs_constituency_participant_rewards: "[CHARACTER.GetShortUIName](이)가 지역구 선거를 마치고 활동에 따른 보상을 받았다."
 fs_constituency_safe_speech_title: "차분한 호소"
 fs_constituency_safe_speech: "[CHARACTER.GetShortUIName](이)가 실현 가능한 약속으로 신뢰를 쌓았다. 지지 점수 +[EmptyScope.ScriptValue('fs_constituency_safe_gain')|0]."
 fs_constituency_expert_success_title: "전문성을 증명함"
 fs_constituency_expert_success: "[CHARACTER.GetShortUIName](이)가 자신의 전문성을 주민에게 납득시켰다. 지지 점수 +[EmptyScope.ScriptValue('fs_constituency_expert_gain')|0]."
 fs_constituency_expert_failure_title: "설득하지 못함"
 fs_constituency_expert_failure: "[CHARACTER.GetShortUIName]의 설명은 주민의 호응을 얻지 못했다. 지지 점수 [EmptyScope.ScriptValue('fs_constituency_expert_failure_gain')|+0]."
 fs_constituency_risk_success_title: "판세를 흔든 발언"
 fs_constituency_risk_success: "[CHARACTER.GetShortUIName]의 대담한 주장이 주민들의 마음을 움직였다. 지지 점수 +[EmptyScope.ScriptValue('fs_constituency_risk_gain')|0]."
 fs_constituency_risk_failure_title: "대담한 주장에 역풍"
 fs_constituency_risk_failure: "[CHARACTER.GetShortUIName]의 과감한 주장이 반발을 불렀다. 지지 점수 [EmptyScope.ScriptValue('fs_constituency_risk_failure_gain')|0]."
 fs_constituency_observer_listen_tt: "현장을 관찰하며 인생관 경험치를 획득함"
 fs_constituency_election.10.t1: "대표자를 고르는 주민들"
 fs_constituency_election.10.t2: "약속을 검증하는 자리"
 fs_constituency_election.10.t3: "마지막 질문을 앞두고"
 fs_constituency_election.10.desc1: "태극기 아래에서 대한민국 헌법이 낭독되고, 주민들이 후보의 서약을 듣기 위해 모였다. 이 의례에서 뽑힌 이는 지역의 청원을 전할 뿐 아니라 대한민국 국회에 들어가 대통령을 선출하게 된다.\n\n나는 후보가 아니지만 국민의 선택이 온전히 이루어지도록 살필 책임이 있다. 후보의 말을 듣고 질서를 지키는 일, 환호 뒤에 감춰진 부정의 기미에 주의를 기울이는 일 모두 참관인의 몫이다."
 fs_constituency_election.10.desc2: "공약을 살피는 자리에 헌법과 장부가 나란히 놓였다. 주민들은 곡물 창고와 길, 구휼에 관한 약속을 묻는다. 후보들은 그 약속이 선조들의 가르침과 국민의 살림을 함께 지킬 길이라 주장한다.\n\n듣기 좋은 경건한 말과 실제로 지킬 수 있는 약속을 구분해야 한다. 최고위 공직자의 지위를 맡길 인물을 고르는 일에, 참관인인 나 역시 어떻게 참여할지 정해야 한다."
 fs_constituency_election.10.desc3: "공개 토론장의 소란이 잦아든다. 헌법의 전례와 교파의 해석, 국회가 져야 할 책임을 두고 마지막 질문들이 정리된다. 곧 이 의례는 한 사람에게 금배지와 대통령 선출권을 부여할 것이다.\n\n누가 어떤 서약을 했는지 기억하는 것도 참관인의 책무다. 의례의 겉모습이 엄숙하다고 그 안의 모든 일이 정당하리라 믿을 수는 없다. 나는 끝까지 국민의 선택을 지켜보려 한다."
 fs_constituency_election.10.listen: "후보들의 답변을 꼼꼼히 비교하겠다."
 fs_constituency_election.10.mediate: "서로의 말을 들을 수 있도록 자리를 중재하겠다."
 fs_constituency_election.10.reflect: "차분히 지켜보며 내 생각도 정리하겠다."
 fs_constituency_election.20.t: "출마 등록이 확정되다"
 fs_constituency_election.20.desc: "공직자가 대한민국 헌법 곁에 놓인 후보 명단에서 내 이름을 읽었다. 집결은 끝났고, 주민 유세·공약 발표·후보 토론을 각각 20일씩 치르게 된다. 각 단계에는 두 번의 핵심 질문이 기다린다.\n\n내가 바라는 것은 신성한 금배지이다. 당선자는 지역의 청원을 맡고 대통령 선출에 참여할 권한을 얻는다. 그 권위는 주민의 선택과 헌법 앞에서 한 서약에 기대어 선다.\n\n현재 지지 점수는 [ROOT.Char.MakeScope.Var('fs_constituency_score').GetValue|0]이다. 후보 자격을 지키고 현장에 남아야 하며, 부정행위를 택했다면 참관인의 조사와 단죄의 위험도 감수해야 한다."
 fs_constituency_election.20.a: "내 이름에 걸맞은 선거를 치르겠다."
 fs_constituency_election.100.t: "지역구의 선택"
 fs_constituency_election.100.intro: "태극기 아래에서 대한민국 헌법이 다시 펼쳐진다. 연설과 공약, 토론을 마친 후보들의 자격을 확인한 공직자들이 국민의 선택을 선포한다. 국회의원의 자리를 맡길 이름을 기다리며 선거장이 조용해진다.\n\n"
 fs_constituency_election.100.winner: "[fs_constituency_result_seat.GetNameNoTier]의 당선자는 #high [fs_constituency_result_winner.GetShortUIName]#!이다. 최종 지지 점수는 #high [SCOPE.GetValue('fs_constituency_final_score')|0]#!, 적격 후보는 [SCOPE.GetValue('fs_constituency_final_count')|0]명이었다. 당선자는 국회의 구성원이 되어 한국교의 최고위 공직자들과 함께 대통령을 선출할 권한을 얻었다."
 fs_constituency_election.100.empty: "마지막 자격 심사를 통과한 후보가 없어 이번 의례에서는 국회의원을 세우지 못했다. 의석은 공석으로 남고, 공동체는 다음 선거에서 그 무거운 공직을 맡길 인물을 다시 찾아야 한다."
 fs_constituency_election.100.candidate: "\n\n나의 최종 지지 점수는 #high [SCOPE.GetValue('fs_constituency_personal_score')|0]#!이다. 주민 앞에서 했던 약속과 이번 선거에서 얻은 경험이 앞으로의 행보를 따라다닐 것이다."
 fs_constituency_election.100.observer: "\n\n나는 헌법 앞에서 한 사람을 국회에 들이는 과정을 지켜보았다. 당선자가 무슨 서약을 했으며 의례가 어떻게 치러졌는지 기억하는 것 또한 참관인의 책임이다."
 fs_constituency_election.100.host_reward: "\n\n선거 개최 보상: [prestige_i] 위신 #P +[SCOPE.GetValue('fs_constituency_host_reward')|0]#!."
 fs_constituency_election.100.candidate_reward: "\n완주 보상: [prestige_i] 위신 #P +[SCOPE.GetValue('fs_constituency_candidate_reward')|0]#!, 외교·관리·학습 생활 양식 경험치 각각 #P +[EmptyScope.ScriptValue('fs_constituency_candidate_skill_xp_reward')|0]#!."
 fs_constituency_election.100.winner_reward: "\n당선 보상: 국회의원 의석과 [prestige_i] 위신 #P +[SCOPE.GetValue('fs_constituency_winner_reward')|0]#!."
 fs_constituency_election.100.observer_reward: "\n참관 보상: 학습 생활 양식 경험치 #P +[SCOPE.GetValue('fs_constituency_observer_reward')|0]#!."
 fs_constituency_election.100.a: "선거의 결과를 확인했다."
 fs_constituency_election.100.scandal: "\n\n이번 의례에서 부정행위 [SCOPE.GetValue('fs_constituency_result_fraud_count')|0]건이 공개되었다. 국민의 신성한 선택이 훼손되었다는 논란은 의석 부여 뒤에도 남는다."
 fs_constituency_election.100.covered: "\n개최자는 그중 [SCOPE.GetValue('fs_constituency_result_covered_count')|0]건을 묵인했다. 처벌을 막아도 이미 드러난 의례의 흠을 지울 수는 없다."
