l_korean:
 activity_fs_constituency_election: "지역구 국회의원 선거"
 activity_fs_constituency_election_plural: "지역구 국회의원 선거"
 activity_fs_constituency_election_desc: "공석인 지역구 [cardinal|E]을 채우는 한국교의 중대한 종교 의례입니다. 국민은 유세·공약 발표·공개 토론으로 후보의 덕과 식견을 살피고, 대한민국 헌법 앞에서 국회에 들어갈 한 사람을 선택합니다. 당선자는 대통령을 선출하는 국회의 구성원이 됩니다."
 activity_fs_constituency_election_selection_tooltip: "지역구 공석 한 자리를 선택하여 국회의원을 세우는 선거 의례를 개최합니다. 출마하려면 ‘국회의원 출마’ 의도를 선택하십시오."
 activity_fs_constituency_election_destination_selection: "선택한 지역구 의석의 관습 수도를 개최지로 선택하십시오. 모든 선거 단계가 같은 장소에서 진행됩니다."
 activity_fs_constituency_election_destination_selection_header: "지역구 선거 개최지 선택"
 activity_fs_constituency_election_host_desc: "대통령은 모든 지역구에서, 주민은 거주 지역구의 공석에 선거를 개최할 수 있습니다. 개최자는 헌법 낭독과 국민의 신성한 선택을 보전할 책임을 집니다. 기본 운영비에 더하여 공정·편향 운영에 투자할 수 있습니다.\n\n$fs_constituency_participation_rewards$"
 activity_fs_constituency_election_guest_desc: "후보는 지역의 청원을 전할 능력과 고위 공직자로서의 덕을 함께 증명해야 합니다. 참관인은 공개 논의에 참여하고 의례를 더럽히는 부정행위를 살필 수 있습니다.\n\n$fs_constituency_participation_rewards$"
 activity_fs_constituency_election_guest_help_text: "출마 의도로 본행사 전에 도착하면 후보가 됩니다. 대통령과 현직 [cardinal|E]은 참관만 할 수 있습니다. 사면받지 않은 선거범은 출마할 수 없습니다."
 activity_fs_constituency_election_province_desc: "선택한 지역구의 선거 개최지"
 activity_fs_constituency_election_host_an_a: "$articleblank_article$"
 activity_fs_constituency_election_predicted_cost: "선거 개최 비용"
 fs_constituency_district: "선거 대상 지역구"
 fs_constituency_district_desc: "공석인 지역구 의석 한 자리를 선택합니다."
 fs_constituency_district_selection_help: "선거를 개최할 지역구를 선택하십시오. 확인 후 지도에서 해당 지역구의 관습 수도를 개최지로 선택하고 여행과 활동을 준비합니다. 회색 항목에 마우스를 올리면 개최할 수 없는 이유가 표시됩니다."
 fs_constituency_selected_district: "선택한 지역구: [ActivityOption.GetName]"
 fs_constituency_hostable_seat_tt: "대통령이거나 해당 지역구의 주민이어야 하며, 다른 선거가 진행되지 않는 지역구 공석이 있어야 합니다."
 fs_constituency_candidate_tt: "한국교를 믿는 활동 가능한 성인이며 해당 지역구에 거주해야 합니다. 대통령·현직 국회의원·사면받지 않은 선거범은 출마할 수 없습니다. 본행사 시작 후에는 후보를 추가하지 않습니다."
 fs_constituency_candidate_intent: "국회의원 출마"
 fs_constituency_candidate_intent_desc: "헌법 앞에서 출마를 서약하고 주민의 지지를 얻어 [college_of_cardinals|E]에 들어갑니다. 본행사 전에 도착해야 하며 사면받지 않은 선거범은 출마할 수 없습니다.\n\n$fs_parliament_dual_office_election_rules_tt$\n$fs_parliament_dual_office_entry_claims_tt$"
 fs_constituency_observer_intent: "선거 참관"
 fs_constituency_observer_intent_desc: "[cardinal|E]을 세우는 의례를 지켜보고 후보들의 덕과 식견을 비교합니다. 부정이 의심되면 조사할 수 있습니다. 당선 경쟁에는 참여하지 않습니다."
 fs_constituency_residents: "지역구 주민"
 fs_constituency_residents_desc: "해당 지역구에 거주하는 한국교 성인 주민과 대통령을 초대합니다."
 fs_constituency_canvassing: "주민 유세"
 fs_constituency_canvassing_desc: "태극기 아래에서 주민들에게 서약과 포부를 밝힙니다. 말의 진실성과 국민을 이끌 덕이 함께 시험받습니다."
 fs_constituency_manifesto: "공약 발표"
 fs_constituency_manifesto_desc: "대한민국 헌법의 가르침을 생계와 재정, 구휼에 어떻게 실천할지 설명하며 공직자의 책무를 증명합니다."
 fs_constituency_debate: "후보 토론"
 fs_constituency_debate_desc: "헌법의 전례와 사회 갈등을 두고 토론하며, 대통령 선출권을 맡길 최고위 공직자의 식견을 검증합니다."
 fs_constituency_safe_choice_tt: "확실하게 지지 점수 [EmptyScope.ScriptValue('fs_constituency_safe_gain')|+0]을 얻습니다."
 fs_constituency_expert_choice_tt: "성공 확률: [ROOT.Char.MakeScope.ScriptValue('fs_constituency_expert_chance_value')|0]%. 성공하면 지지 점수 [EmptyScope.ScriptValue('fs_constituency_expert_gain')|+0], 실패하면 [EmptyScope.ScriptValue('fs_constituency_expert_failure_gain')|+0]."
 fs_constituency_risk_choice_tt: "성공 확률: [ROOT.Char.MakeScope.ScriptValue('fs_constituency_risk_chance_value')|0]%. 성공하면 지지 점수 [EmptyScope.ScriptValue('fs_constituency_risk_gain')|+0], 실패하면 [EmptyScope.ScriptValue('fs_constituency_risk_failure_gain')|+0]."
 fs_constituency_scoreboard_title: "지역구 선거 현황"
 fs_constituency_scoreboard_seat: "[Activity.MakeScope.Var('fs_constituency_seat').Title.GetNameNoTier] 지역구"
 fs_constituency_scoreboard_round: "진행 단계: [Activity.MakeScope.Var('fs_constituency_round').GetValue|0]/3"
 fs_constituency_assembly_help: "후보들이 집결하고 있습니다. 출마 의도를 선택하고 본행사 시작 전에 도착한 주민만 후보로 등록됩니다."
 fs_constituency_candidate_score: "지지 점수: [Character.MakeScope.Var('fs_constituency_score').GetValue|0]"
 fs_constituency_candidate_disqualified: "후보 자격 상실"
 fs_constituency_winner_summary: "[Activity.MakeScope.Var('fs_constituency_final_candidate_count').GetValue|0]명의 적격 후보 가운데 [Activity.MakeScope.Var('fs_constituency_winner').Char.GetShortUIName](이)가 당선되었습니다.\n최종 지지 점수: [Activity.MakeScope.Var('fs_constituency_winning_score').GetValue|0]\n\n대한민국 헌법 앞에서 금배지를 받은 당선자는 한국교 최고위 공직자들의 국회에 들어가 대통령을 선출할 권한을 얻었습니다. 개최자와 참가자는 활동 보상을 받았습니다."
 fs_constituency_cancelled_summary: "선거가 취소되었습니다. 지역구 의석은 공석으로 남습니다."
 fs_constituency_no_winner_summary: "선거가 끝났으나 적격 후보가 없어 의석은 공석으로 남습니다."
 fs_constituency_result_toast: "지역구 국회의원 선거 결과"
 fs_constituency_winner_tt: "[fs_constituency_result_winner.GetShortUIName](이)가 [fs_constituency_result_seat.GetNameNoTier] 지역구의 국회의원으로 당선되었습니다."
 fs_constituency_cancelled_tt: "선거가 취소되었습니다. 새 의원은 선출되지 않았습니다."
 fs_constituency_no_winner_tt: "적격 후보가 없어 새 의원이 선출되지 않았습니다."
