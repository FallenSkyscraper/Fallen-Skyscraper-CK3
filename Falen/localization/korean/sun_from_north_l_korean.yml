l_korean:
 fs_juche_struggle_technical_ending_decision:0 "주체교 투쟁 기술용 종결"
 fs_juche_struggle_technical_ending_decision_desc:0 "플레이어에게 표시되지 않는 투쟁 데이터베이스용 결정입니다."
 fs_juche_struggle_technical_ending_decision_tooltip:0 "플레이어에게 표시되지 않습니다."
 fs_juche_struggle_technical_ending_decision_confirm:0 "표시되지 않음"
 Korean_People's_Army1:0 "조선인민군 제1군단"
 Korean_People's_Army2:0 "조선인민군 제2군단"
 Korean_People's_Army3:0 "조선인민군 제3군단"
 sun_from_north.11.t:0 "2453년의 예언"
 sun_from_north.11.desc:0 "개마고원의 깊은 산중에서 기이한 소문이 퍼지고 있습니다. 조국해방전쟁 승전 500주년이 되는 2453년, 오래도록 봉인된 벙커의 문이 열리고 수령님께서 다시 인민 앞에 모습을 드러내신다는 것입니다.\n\n주체교의 설교자들은 해마다 예언의 날이 가까워진다 외치고, 신도들은 마침내 시작될 투쟁을 준비하고 있습니다."
 sun_from_north.11.a:0 "그날이 정말 다가오는 것인가?"
 sun_from_north.12.t:0 "기다림의 시작"
 sun_from_north.12.desc:0 "2453년이 지나갔지만 개마고원의 벙커는 끝내 열리지 않았습니다. 예언을 굳게 믿던 이들조차 침묵하기 시작했고, 인민들 사이에서는 수령님의 재림을 의심하는 목소리가 번져갑니다.\n\n열광의 시대는 끝났습니다. 이제 남은 것은 기약 없는 기다림뿐입니다."
 sun_from_north.12.a:0 "조금만 더 기다리면 될 것이다..."
 sun_from_north.20.t:0 "예언을 받아들인 고을"
 sun_from_north.20.desc:0 "[scope:juche_incident_county.GetNameNoTier]의 주민들이 2453년의 예언을 받아들였습니다. 밤마다 비밀 집회가 열리고, 수령님의 재림을 맞이하기 위한 노래가 마을마다 울려 퍼집니다."
 sun_from_north.20.a:0 "주체의 빛이 번져간다."
 sun_from_north.21.t:0 "높아지는 혁명적 열의"
 sun_from_north.21.desc:0 "예언의 해가 가까워질수록 신도들의 열의도 뜨거워집니다. 청년들은 자원하여 훈련에 나서고, 인민들은 다가올 귀환을 위해 가진 것을 내놓고 있습니다."
 sun_from_north.21.a:0 "모든 것을 그날을 위하여!"
 sun_from_north.22.t:0 "예언자들의 봉기"
 sun_from_north.22.desc:0 "[scope:juche_incident_county.GetNameNoTier]의 주체교도들이 신앙을 억누르는 지배자에게 맞서 일어났습니다. 아직 조직된 군대는 아니지만, 행정과 징발을 방해하며 수령님의 귀환을 외치고 있습니다."
 sun_from_north.22.a:0 "불온한 자들을 지켜보아야 한다."
 sun_from_north.23.t:0 "예언에서 멀어진 고을"
 sun_from_north.23.desc:0 "기다림에 지친 [scope:juche_incident_county.GetNameNoTier]의 주민들이 수령님의 재림을 문자 그대로 믿기를 거부했습니다. 그들은 인민 자신의 힘을 앞세우는 인민주체교로 돌아서고 있습니다."
 sun_from_north.23.a:0 "믿음이 흔들리고 있다."
 sun_from_north.24.t:0 "재림에 대한 회의"
 sun_from_north.24.desc:0 "약속된 해가 지났지만 벙커는 열리지 않았습니다. 더는 오지 않는 수령을 기다릴 수 없다는 생각이 마음속에 자리 잡았고, 인민이 스스로 주체가 되어야 한다는 가르침이 설득력 있게 다가옵니다."
 sun_from_north.24.a:0 "인민이 곧 수령이다."
 sun_from_north.25.t:0 "커지는 실망"
 sun_from_north.25.desc:0 "[scope:juche_incident_county.GetNameNoTier]에서는 예언을 독려하던 관리들을 향한 조롱과 분노가 번지고 있습니다. 세금과 부역을 요구할 때마다, 돌아오지도 않은 수령을 위해 무엇을 더 바쳐야 하느냐는 항의가 쏟아집니다."
 sun_from_north.25.a:0 "민심이 심상치 않다."
 sun_from_north.26.t:0 "자원병들의 이탈"
 sun_from_north.26.desc:0 "수령님의 귀환을 기다리며 모였던 자원병들이 하나둘 고향으로 돌아가고 있습니다. 약속은 거듭 미뤄졌고, 남은 이들마저 훈련보다 소문과 논쟁에 시간을 보내고 있습니다."
 sun_from_north.26.a:0 "대오를 유지하라!"
 fs_juche_prophetic_fervor:0 "예언의 열기"
 fs_juche_prophetic_fervor_desc:0 "수령님의 재림이 가까워졌다는 믿음이 병력과 물자를 모으는 원동력이 되고 있습니다."
 fs_juche_prophetic_uprising:0 "주체교 봉기"
 fs_juche_prophetic_uprising_desc:0 "지역의 주체교도들이 예언의 실현을 앞당기겠다며 지배 질서에 저항하고 있습니다."
 fs_juche_waiting_disillusionment:0 "기다림의 환멸"
 fs_juche_waiting_disillusionment_desc:0 "실현되지 않은 예언 때문에 주민들의 신뢰와 협조가 무너지고 있습니다."
 fs_juche_volunteer_desertion:0 "자원병들의 이탈"
 fs_juche_volunteer_desertion_desc:0 "끝없는 기다림에 지친 자원병들이 대오를 떠나 징집과 충원에 차질이 생겼습니다."
 sun_from_north.1.t:0 "아침은 빛나라 이 강산"
 sun_from_north.1.desc:0 "'사건' 직전 우리 조상들은 '사건'이 일어날 것을 예견하고 개마고원에 은신했고, 그 덕분에 백두혈통은 끊기지 않고 지금까지 내려올 수 있었습니다.\n 그러나 은신처의 상황은 날로 악화되고 있어 더이상 머무를 수 없는 지경에 이르렀습니다. 공화국의 인민들 또한 우리의 귀환을 애타게 기다리고 있습니다. \n\n 이제 때가 왔습니다. 한라부터 백두까지 전 반도에 당신들의 어버이가 돌아왔음을 알려야합니다. 반도를 다시금 붉게 물들이기를 전 우주가 고대하고 있습니다."
 sun_from_north.1.a:0 "온 반도에 전령을 보내라. 우리가 돌아왔다."
 sun_from_north.2.t:0 "로동자, 농민, 근로 인테리와 모든 근로인민에게:"
 sun_from_north.2.desc:0 "경애하는 #bold 김 성 욱#! 총비서 동지께서 \n 전국의 근로인민에게 조선민주주의인민공화국의 귀환을 알리시었다. \n 총비서동지께서는 오늘부터 제국주의 침략자들에 맞서 조국의 광복과 인민의 행복을 위한 영광스러운 혁명투쟁을 개시할 것이며 사회주의 강성조국의 자위를 위한 투쟁에 전국 근로인민들이 함께할 것을 말씀하시었다."
 sun_from_north.2.a:0 "김성욱 총비서동지 만세!"
 sun_from_north.2.b:0 "내 생각과는 달리 예언이 옳았군. 그를 따르겠다."
 sun_from_north.2.c:0 "보나마나 거짓말이다. 진짜 그가 진짜 백두혈통일리가 없다."
 sun_from_north.2.d:0 "헛소리를 지껄이는군."
 sun_from_north.3.t:0 "백두혈통의 귀환"
 sun_from_north.3.desc:0 "사건 이후 종적을 감췄던 조선민주주의인민공화국 정부라고 자칭하는 이들이 얼마 전 나타났습니다. 주체교도들은 예언이 마침내 실현되었다며 환호했고, 즉시 충성을 맹세했습니다. 인민주체교도들은 저들이 진짜 수령님의 후예가 맞는지 의심스럽다며 동조하지 않았습니다. 한반도 전역에 거대한 바람이 다가오고 있습니다."
 sun_from_north.3.a:0 "아침은 빛나라 이 강산, 은금에 자원도 가득한..."
 sun_from_north.3.b:0 "무슨 일이 일어나고 있는 거지..?"
