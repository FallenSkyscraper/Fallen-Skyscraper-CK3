l_korean:
 fs_anniversary.common.a:0 "뜻깊은 이날을 기리자."
 fs_anniversary.1.t:0 "광복 500주년"
 fs_anniversary.1.desc:0 "오늘은 한반도가 식민 지배에서 벗어나 광복을 맞이한 지 500년이 되는 날입니다. 오랜 세월이 흘렀으나 해방을 위해 헌신한 이들의 뜻은 여전히 신도들의 마음속에 살아 있습니다."
 fs_anniversary.2.t:0 "건국 500주년"
 fs_anniversary.2.desc:0 "오늘은 1948년 한반도에 새로운 국가가 세워진 지 500년이 되는 날입니다. 신도들은 건국의 이상과 지나간 역사를 되새기며 성대한 기념 의식을 거행합니다."
 fs_anniversary.3.t:0 "공자 탄신 3000주년"
 fs_anniversary.3.desc:0 "오늘은 위대한 스승 공자의 탄신 3000주년입니다. 천하의 유학자들은 예와 인의 가르침을 되새기며 성인의 뜻을 받들 것을 다짐합니다."
 fs_anniversary.4.t:0 "6·25 개전 500주년"
 fs_anniversary.4.desc:0 "오늘은 한반도를 불길에 휩싸이게 한 6·25 전쟁이 시작된 지 500년이 되는 날입니다. 전쟁의 기억은 각자의 신앙과 역사관 속에서 여전히 무거운 의미를 지닙니다."
 fs_anniversary.5.t:0 "6·25 정전 500주년"
 fs_anniversary.5.desc:0 "오늘은 6·25 전쟁의 포성이 멎고 정전 협정이 체결된 지 500년이 되는 날입니다. 신도들은 희생자를 추모하고 반도에 찾아왔던 불완전한 평화를 되새깁니다."
 fs_anniversary.6.t:0 "불기 3000년"
 fs_anniversary.6.desc:0 "불기 3000년의 새해가 밝았습니다. 사찰마다 종소리가 울리고 사부대중은 부처의 가르침이 앞으로도 중생의 길을 밝히기를 기원합니다."
 fs_anniversary.7.t:0 "포덕 600년"
 fs_anniversary.7.desc:0 "수운 최제우가 사람은 곧 하늘이라는 새 가르침을 펼친 지 600년이 되었습니다. 천도교인들은 포덕의 뜻을 기리고 다시금 인내천의 도리를 되새깁니다."
 fs_anniversary.8.t:0 "소련 해체 500주기"
 fs_anniversary.8.desc:0 "오늘은 소비에트 연방이 해체된 지 500년이 되는 날입니다. 맑스주의자들은 최초의 거대한 사회주의 실험이 남긴 성취와 실패를 돌아보며 혁명의 의미를 되묻습니다."
 fs_anniversary.9.t:0 "천주교 대희년"
 fs_anniversary.9.desc:0 "새 천년의 대희년이 밝았습니다. 온 교회의 신자들이 구원과 화해를 기원하며 성대한 미사와 순례로 이 거룩한 해를 맞이합니다."
 fs_anniversary.10.t:0 "조선인민공화국 건국 100주년"
 fs_anniversary.10.desc:0 "오늘은 조선인민공화국의 건국이 선포된 지 100년이 되는 날입니다. 천도교인들은 민족과 인민이 주인이 되는 나라를 꿈꾸었던 선열들의 뜻을 기립니다."
 fs_anniversary.11.t:0 "무함마드 탄신 2000주년"
 fs_anniversary.11.desc:0 "오늘은 예언자 무함마드의 탄신 2000주년입니다. 신자들은 예언자의 삶과 가르침을 되새기며 알라께 감사와 찬미를 올립니다."
 fs_anniversary.12.t:0 "태양절 600돐"
 fs_anniversary.12.desc:0 "위대한 수령님의 탄생을 기리는 태양절 600돐이 밝았습니다. 주체교도들은 수령님의 업적과 가르침을 찬양하며 충성을 새롭게 다짐합니다."
 fs_anniversary.13.t:0 "원기 600년"
 fs_anniversary.13.desc:0 "소태산 대종사가 원불교의 문을 연 지 600년이 되었습니다. 교도들은 물질이 개벽된 시대에 정신을 개벽하라는 가르침을 되새깁니다."
 fs_anniversary.14.t:0 "신성복음연합 건국 200주년"
 fs_anniversary.14.desc:0 "오늘은 신성복음연합이 세워진 지 200년이 되는 날입니다. 제국국교회의 성직자와 신도들은 건국의 신성한 사명을 기리며 연합의 번영을 기도합니다."
 fs_anniversary.15.t:0 "종교개혁 500주년"
 fs_anniversary.15.desc:0 "오늘은 개신교 종교개혁이 시작된 지 500년이 되는 날입니다. 신자들은 믿음과 성서의 가치를 되새기며 개혁자들의 용기를 기립니다."
 fs_anniversary.16.t:0 "이슬람력 2000년"
 fs_anniversary.16.desc:0 "이슬람력 2000년의 새 시대가 열렸습니다. 신자들은 예언자의 이주에서 시작된 공동체의 긴 역사를 되돌아보며 알라의 인도를 구합니다."
 fs_anniversary.17.t:0 "숭정 1000년"
 fs_anniversary.17.desc:0 "숭정 연호가 시작된 지 1000년이 되었습니다. 유학자들은 역법과 예제를 되새기며 무너진 왕조를 넘어 이어진 문명의 도통을 기립니다."
 fs_anniversary.18.t:0 "단기 5000년"
 fs_anniversary.18.desc:0 "단군왕검의 고조선 건국으로부터 5000년이 되는 해가 밝았습니다. 무속의 사제와 신도들은 하늘과 땅, 조상에게 제를 올리며 민족의 시원을 기립니다."
