l_korean:
 game_concept_grandduke_struggle:0 "북부 대공령의 운명"
 game_concept_grandduke_struggle_desc:0 "$game_concept_grandduke_struggle$은 기계교 공동체와 제국교 권력 사이의 불안한 균형을 다루는 북부의 [struggle|E]입니다. 방치된 반란과 내전, 정치적 배신은 파국을 재촉합니다. 북부 대공은 값비싼 조치로 위기를 늦출 수 있지만, 촉매가 1000에 이르면 대공령 자체가 무너집니다."
 grandduke_struggle:0 "$game_concept_grandduke_struggle$"
 grandduke_struggle_desc:0 "$game_concept_grandduke_struggle_desc$"

 game_concept_struggle_phase_grandduke_under_control:0 "교착"
 game_concept_struggle_phase_grandduke_under_control_desc:0 "북부의 제국교 통치자들과 기계교 공동체가 위태로운 균형을 이루고 있습니다. 반란과 배신, 내부 전쟁이 [struggle_catalyst_catalysts|E]를 쌓아 올리며, 진행도가 1000에 도달하면 [struggle_phase_grandduke_out_of_control|E]이 시작됩니다."
 struggle_phase_grandduke_under_control:0 "$game_concept_struggle_phase_grandduke_under_control$"
 struggle_phase_grandduke_under_control_desc:0 "$game_concept_struggle_phase_grandduke_under_control_desc$"
 game_concept_struggle_phase_grandduke_out_of_control:0 "파국"
 game_concept_struggle_phase_grandduke_out_of_control_desc:0 "북부 대공령을 붙들던 마지막 질서가 붕괴했습니다. 대공 작위는 사라지고, 북부 영주들은 기계교 신앙을 받아들이라는 거센 압력 앞에 놓입니다."
 struggle_phase_grandduke_out_of_control:0 "$game_concept_struggle_phase_grandduke_out_of_control$"
 struggle_phase_grandduke_out_of_control_desc:0 "$game_concept_struggle_phase_grandduke_out_of_control_desc$"
 fs_grandduke_stalemate_faith_effects:0 "위태로운 종교적 교착"
 struggle_parameter_fs_grandduke_title_revocation_blocked:0 "[struggle_region|E]에 수도를 둔 영주의 작위를 박탈할 수 없음"

 catalyst_grandduke_rebellion:0 "북부 반란 발생 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_rebellion_desc:0 "북부에서 반란 전쟁이 시작되어 파국 진행도가 #N 250#! 증가했습니다."
 catalyst_grandduke_title_usurped:0 "북부 작위 찬탈 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_title_usurped_desc:0 "북부의 작위가 찬탈되어 파국 진행도가 #N 50#! 증가했습니다."
 catalyst_grandduke_ruler_murdered:0 "북부 영주 살해 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_ruler_murdered_desc:0 "북부의 영주가 살해되어 파국 진행도가 #N 50#! 증가했습니다."
 catalyst_grandduke_internal_war:0 "북부 내부 전쟁 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_internal_war_desc:0 "북부 영주들 사이에 전쟁이 시작되어 파국 진행도가 #N 25#! 증가했습니다."
 catalyst_grandduke_year_passed:0 "불안정한 한 해 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_year_passed_desc:0 "아무런 근본적 해결 없이 한 해가 지나 파국 진행도가 #N 1#! 증가했습니다."
 catalyst_grandduke_escalation_20:0 "종교 갈등 격화 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_escalation_20_desc:0 "북부의 종교 갈등이 격화되어 파국 진행도가 #N 20#! 증가했습니다."
 catalyst_grandduke_deescalation_20:0 "종교 갈등 완화 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_deescalation_20_desc:0 "북부의 종교 갈등이 누그러져 파국 진행도가 #P 20#! 감소했습니다."
 catalyst_grandduke_deescalation_50:0 "대공의 안정화 조치 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_deescalation_50_desc:0 "북부 대공의 정책으로 파국 진행도가 #P 50#! 감소했습니다."
 catalyst_grandduke_deescalation_200:0 "황제군의 개입 [struggle_catalyst_catalyst|E]"
 catalyst_grandduke_deescalation_200_desc:0 "황제군이 북부 질서를 강제로 회복하여 파국 진행도가 #P 200#! 감소했습니다."

 fs_grandduke_dispatch_constables_decision:0 "치안관 파견"
 fs_grandduke_dispatch_constables_decision_desc:0 "대규모 치안관 조직을 북부 전역에 파견하여 약해진 행정력을 되살리고 반란의 불씨를 짓밟습니다."
 fs_grandduke_dispatch_constables_decision_tooltip:0 "[gold_i] 300을 들여 전 영토의 [control|E]을 20 높이고 파국 진행도를 50 낮춥니다. 10년에 한 번 시행할 수 있습니다."
 fs_grandduke_dispatch_constables_decision_confirm:0 "치안관들을 보내라"
 fs_grandduke_religious_tolerance_decision:0 "종교 관용 정책"
 fs_grandduke_religious_tolerance_decision_desc:0 "기계교 공동체에 대한 탄압을 일부 거두고 제한적인 신앙의 자유를 허락합니다. 제국교 강경파는 이를 굴욕으로 여길 것입니다."
 fs_grandduke_religious_tolerance_decision_tooltip:0 "[prestige_i] 750을 소모하여 10년 동안 전 영토의 [county_opinion|E]을 20 높이고 파국 진행도를 50 낮춥니다. 10년에 한 번 시행할 수 있습니다."
 fs_grandduke_religious_tolerance_decision_confirm:0 "관용을 선포하라"
 fs_grandduke_purge_heretics_decision:0 "이교도 색출"
 fs_grandduke_purge_heretics_decision_desc:0 "충성스러운 성직자와 병사들을 풀어 숨어 있는 기계교 조직을 색출합니다. 공포가 당장의 질서를 회복할 것입니다."
 fs_grandduke_purge_heretics_decision_tooltip:0 "[piety_i] 500을 소모하여 [dread|E]를 20 얻고 파국 진행도를 50 낮춥니다. 10년에 한 번 시행할 수 있습니다."
 fs_grandduke_purge_heretics_decision_confirm:0 "모조리 찾아내라"
 fs_grandduke_dispatch_imperial_army_decision:0 "황제군 파견 요청"
 fs_grandduke_dispatch_imperial_army_decision_desc:0 "북부 대공만의 힘으로는 질서를 지킬 수 없음을 인정하고 황제의 군대를 청합니다. 대가는 황제에게 진 빚과 폭정이라는 오명입니다."
 fs_grandduke_dispatch_imperial_army_decision_tooltip:0 "황제가 당신에 대한 [weak_hook|E]을 얻고 당신의 [tyranny|E]이 20 증가하는 대신 파국 진행도를 200 낮춥니다. 평생 한 번만 시행할 수 있습니다."
 fs_grandduke_dispatch_imperial_army_decision_confirm:0 "황제군을 불러들여라"
 fs_grandduke_end_struggle_decision:0 "북부의 신앙 통일 선언"
 fs_grandduke_end_struggle_decision_desc:0 "북부의 마지막 영지까지 제국교를 받아들였습니다. 이제 오랜 종교 분쟁의 종결과 대공령의 완전한 승리를 선포할 수 있습니다."
 fs_grandduke_end_struggle_decision_tooltip:0 "북부 대공령의 운명을 승리로 종결하고 [prestige_i] 3000과 [piety_i] 2000을 얻으며 [crown_authority|E]을 절대 왕권으로 변경합니다."
 fs_grandduke_end_struggle_decision_confirm:0 "북부는 하나의 신앙 아래 섰다"
 fs_grandduke_all_north_imperial_church_tt:0 "북부 지역의 모든 영지가 [GetFaithByKey('imperial_church').GetName] 신앙이어야 함"
 fs_grandduke_forced_conversion_blocked_tt:0 "북부 대공령의 운명 투쟁이 계속되는 동안 북부 영주에게 개종을 강요할 수 없음"
 fs_grandduke_revocation_blocked_tt:0 "북부 대공령의 운명 투쟁이 계속되는 동안 북부 영주의 작위를 박탈할 수 없음"
 fs_grandduke_struggle_success_reason:0 "북부 제국교 통일"
 fs_grandduke_struggle_fall_reason:0 "대공령의 몰락"

 fs_grandduke_struggle.1000.t:0 "대공령의 몰락"
 fs_grandduke_struggle.1000.desc:0 "북부를 붙들어 매던 명령 체계가 마침내 무너졌다. 요새의 깃발은 내려오고 관리들은 달아났으며, 곳곳의 기계교 공동체는 이제 숨지 않고 거리로 쏟아져 나온다. 북부 대공이라는 이름은 더 이상 누구에게도 복종을 명할 수 없다."
 fs_grandduke_struggle.1000.a:0 "북부 대공령은 끝났다."
 fs_grandduke_struggle.1001.t:0 "기계의 복음"
 fs_grandduke_struggle.1001.desc:0 "대공령의 몰락과 함께 기계교 사제와 신도들이 나의 궁정 앞에 모였다. 그들은 옛 질서가 끝났으니 북부의 진정한 신앙을 받아들이라고 요구한다. 그들의 행렬 뒤로는 무장한 군중이 끝도 없이 이어진다."
 fs_grandduke_struggle.1001.a:0 "기계의 진리를 받아들이겠다."
 fs_grandduke_struggle.1001.b:0 "나는 굴복하지 않는다!"

 fs_grandduke_struggle.2000.t:0 "기계교 사제단의 방문"
 fs_grandduke_struggle.2000.desc:0 "여러 지방을 순회하던 기계교 사제단이 나의 궁정에 도착했다. 그들은 성스러운 기계의 말씀을 전할 자리를 청하며, 우리 공동체가 여전히 굳건하다는 것을 온 북부에 보이고자 한다."
 fs_grandduke_struggle.2000.a:0 "황송하게 대접하라."
 fs_grandduke_struggle.2000.b:0 "예를 갖추어 돌려보내라."
 fs_grandduke_struggle.2000.c:0 "가진 것을 모두 빼앗아라."
 fs_grandduke_struggle.2010.t:0 "제국 이단심문관의 검속"
 fs_grandduke_struggle.2010.desc:0 "제국의 이단심문관들이 영지에 들이닥쳐 기계교 공동체를 샅샅이 뒤지고 있다. 체포와 압수가 이어지는 가운데, 신도들은 내가 그들을 지켜 줄 것인지 숨죽여 바라본다."
 fs_grandduke_struggle.2010.a:0 "돈을 쥐여 주고 눈을 감게 하라."
 fs_grandduke_struggle.2010.b:0 "은밀히 공동체들을 보호하라."
 fs_grandduke_struggle.2010.b.tt:0 "당신의 [intrigue|E]에 따라 계책의 성패가 결정됩니다."
 fs_grandduke_struggle.2010.b.success:0 "이단심문관들의 수색을 헛돌게 만들었습니다."
 fs_grandduke_struggle.2010.b.failure:0 "계책이 발각되어 위신과 수도의 발전이 훼손되고 파국 진행도가 20 증가합니다."
 fs_grandduke_struggle.2010.c:0 "내가 나설 일은 아니다."
 fs_grandduke_struggle.2020.t:0 "과학의 달 축제"
 fs_grandduke_struggle.2020.desc:0 "기계의 이치를 탐구하고 옛 지식을 기리는 과학의 달이 돌아왔다. 신도들은 낡은 장치를 닦아 전시하고, 학자들의 강연과 성대한 행렬을 준비하며 나의 참석을 기다린다."
 fs_grandduke_struggle.2020.a:0 "축제에 참가하겠다."
 fs_grandduke_struggle.2020.b:0 "이번에는 모습을 드러내지 않겠다."

 fs_grandduke_religious_tolerance_modifier:0 "북부 종교 관용 정책"
 fs_grandduke_religious_tolerance_modifier_desc:0 "당국이 제한적인 종교의 자유를 인정하여 주민들의 불만이 누그러졌습니다."
 fs_grandduke_inquisition_development_penalty:0 "이단심문관의 파괴적 검속"
 fs_grandduke_inquisition_development_penalty_desc:0 "검속과 충돌로 수도의 공동체와 기반 시설이 훼손되었습니다."
 fs_grandduke_inquisition_popular_opinion_penalty:0 "버림받은 기계교 공동체"
 fs_grandduke_inquisition_popular_opinion_penalty_desc:0 "통치자가 제국 이단심문관의 탄압을 방관한 일을 주민들이 잊지 않고 있습니다."
