l_korean:
 # Election administration, offences and absolution.
 fs_constituency_administration: "선거 운영"
 fs_constituency_administration_desc: "국회를 구성할 최고위 공직자를 뽑는 의례를 어떻게 준비할지 정합니다."
 fs_constituency_ordinary: "없음"
 fs_constituency_ordinary_desc: "기본 진행 요원과 기존 절차로 선거 의례를 치릅니다. 추가 비용과 특별한 감시·교파 보정은 없습니다."
 fs_constituency_fair: "공정한 선거 운영"
 fs_constituency_fair_desc: "명부를 대조할 공직자를 늘리고 투표함의 봉인과 집계 기록을 점검합니다. 대한민국 헌법 앞에서 국민의 선택을 온전히 보존하기 위한 투자입니다.\n\n부정행위의 증거 발견 확률이 #P +[EmptyScope.ScriptValue('fs_constituency_fair_detection_bonus')|0]#!%p 증가합니다. 강화된 감시는 후보들의 부정선거 시도를 억제합니다."
 fs_constituency_biased: "편향적 선거 운영"
 fs_constituency_biased_desc: "의례의 진행 요원을 개최 측 교파에 우호적인 공직자들로 채웁니다. 누구의 연설을 더 돋보이게 할지, 어떤 명부와 투표함을 면밀히 살필지에 교파의 이해가 스며듭니다.\n\n 개최 당시 개최자의 교파와 같은 후보는 단계마다 지지 점수 +[EmptyScope.ScriptValue('fs_constituency_bias_gain')|0], 증거 발견 확률 [EmptyScope.ScriptValue('fs_constituency_biased_detection_penalty')|0]%p를 적용받습니다. 해당 후보의 부정이 공개되면 개최자가 처벌을 묵인할 수 있습니다."
 fs_constituency_offender_cannot_run_tt: "대통령에게 사면받지 않은 선거범은 지역구 국회의원 선거에 출마할 수 없습니다."
 fs_constituency_honest_campaign_tt: "헌법과 국민 앞에서 정직한 경쟁을 약속합니다. 부정행위 보너스와 신앙도 비용은 없습니다. 성격에 따라 스트레스가 변합니다."
 fs_constituency_fraud_campaign_tt: "부정선거를 조직하여 신앙도 [EmptyScope.ScriptValue('fs_constituency_fraud_piety_cost')|0]을 한 번 잃습니다. 신앙도가 부족하면 음수가 될 수 있으며, 성격에 따른 스트레스 변화도 적용됩니다. 금화는 소모하지 않습니다.\n\n정직한 경쟁에서 얻는 점수와 별개로 단계마다 지지 점수 +[EmptyScope.ScriptValue('fs_constituency_fraud_gain')|0]을 얻습니다. 계책력과 학습력이 높으면 증거를 남길 가능성이 줄어듭니다.\n\n증거가 발견되어도 참관인이 조사하고 문제를 제기해야 처벌받습니다. 처벌 시 명예·헌신 단계가 각각 1 하락하고 선거범이 되어, 대통령의 사면 전까지 지역구 피선거권을 잃습니다. 국회의원 임명은 가능하지만 대통령 후보 점수에는 막대한 감점이 붙습니다. 이번 선거에서 퇴출되며, 개최자라면 후보 자격만 잃고 운영을 계속합니다.\n\n선택은 본행사 첫날에 확정됩니다. 미응답 시 정직한 출마로 처리됩니다."
 fs_constituency_investigate_fraud_tt: "증언과 기록을 대조해 진실을 밝혀냅니다. 정확한 확인 확률: [ROOT.Char.MakeScope.ScriptValue('fs_constituency_investigation_chance_value')|0]%.\n\n실제 부정을 입증하면 공개적으로 문제를 제기하고 신앙도를 얻습니다. 실제 부정이 없는데 잘못 고발하면 위신·신앙도를 잃습니다. 결백을 확인하거나 실제 부정을 밝혀내지 못하면 별도 보상·벌점은 없습니다.\n\n개최자가 같은 교파의 범행을 묵인해도 발견 보상은 유지됩니다. 단계가 마감된 뒤의 응답은 반영되지 않습니다."
 fs_constituency_ignore_fraud_tt: "의심을 공론화하지 않습니다. 실제 부정이 있었는지와 관계없이 이번 사건은 효과 없이 종료됩니다. 성격에 따른 스트레스 변화는 적용됩니다."
 fs_constituency_fraud_conviction_title: "선거범으로 단죄되다"
 fs_constituency_fraud_conviction_tt: "#x 선거범은 대통령의 사면 전까지 지역구 국회의원 선거에 출마할 수 없음 #!"
 fs_constituency_cover_fraud_tt: "#X 부정선거를 시도한 후보가 여전히 선거에 참여함 #!"
 fs_constituency_candidate_fraud_disqualified: "#N 부정선거로 실격#!"
 fs_constituency_presidential_offender_penalty_tt: "사면받지 않은 선거범: [EmptyScope.ScriptValue('fs_constituency_presidential_offender_penalty')|0]"

 fs_constituency_fraud.1.t: "헌법 앞의 서약, 장막 뒤의 유혹"
 fs_constituency_fraud.1.desc: "태극기 아래에 대한민국 헌법이 펼쳐진다. 공직자가 선거의 절차를 낭독하는 동안, 나는 아직 비어 있는 국회의원석을 생각한다. 그곳에 앉는 이는 지역의 청원을 전하는 데 그치지 않는다. 한국교를 이끌 고위 공직자들의 국회에 들어가 대통령을 선출하고, 국민이 물려받은 신성한 질서를 지킬 책무를 얻는다.\n\n숙소로 돌아오자 측근이 목소리를 낮춘다. 주민의 궁핍을 달래는 선물, 표를 약속하는 후원자, 이름이 흐릿한 명부, 충성스러운 진행 요원들이 있다면 순수한 설득에만 운명을 맡길 필요는 없다는 것이다. 한 번 발을 들이면 유세에서 최종 집계에 이르기까지 장막 뒤의 손이 나를 도울 수 있다.\n\n나는 이것을 국가와 국민을 위한 불가피한 수단이라 부를 수도 있다. 그러나 헌법 앞에서 서약한 자가 국민의 선택을 훔치는 일임을, 신앙까지 속여 가며 부정할 수 있을까?"
 fs_constituency_fraud.1.honest: "의석은 정직한 서약과 주민의 신뢰로 얻겠다."
 fs_constituency_fraud.1.cheat: "의석을 얻어야 한다. 장막 뒤의 일은 맡기겠다."
 fs_constituency_fraud.10.t: "의례의 장막 뒤에서"
 fs_constituency_fraud.10.bribes: "유세가 끝나고 헌법을 덮는 소리가 들리자, 내 측근들은 미리 말을 맞춘 주민들을 따로 만났다. 손에 쥐여진 돈과 물품에는 내 이름이 붙어 있었다. 그들이 연단 앞에서 보낸 환호가 믿음에서 나왔는지 대가에서 나왔는지, 나는 묻지 않았다.\n\n누군가는 이를 어려운 이웃을 돌보는 공직자의 덕이라 칭찬했다. 그러나 선물을 받은 이가 어느 후보를 지지해야 하는지까지 전해 들었다면, 그것은 이미 베풂과는 다른 거래다. 내 이름을 지지한다는 보고가 예전보다 빠르게 쌓였다."
 fs_constituency_fraud.10.patronage: "측근들은 돈을 대놓고 건네는 대신 구휼과 후원 약속을 앞세웠다. 곡물을 배분받을 집, 일을 맡길 사람, 당선 뒤 도움을 받을 모임의 이름이 은밀한 장부에 적혔다. 나는 모두가 보는 자리에서 국민의 생계를 약속했고, 장막 뒤에서는 그 약속이 특정한 지지와 교환되었다.\n\n누구도 노골적으로 표를 사겠다고 말하지 않았다. 다만 은혜를 기억하는 주민이라면 어떤 이름에 힘을 보태야 할지 안다는 말이 되풀이되었다. 선조들의 상부상조를 계승한다는 명분 아래, 선택의 자유는 보이지 않는 빚으로 묶였다."
 fs_constituency_fraud.10.ghosts: "진행 요원의 손을 거친 선거인 명부에는 낯선 이름이 늘어 있었다. 이미 장례를 치른 이, 누구도 집을 가리키지 못하는 주민, 다른 표기로 거듭 적힌 사람이 섞여 있었다. 그 빈자리는 모두 내게 유리한 지지로 돌아왔다.\n\n나는 대한민국 헌법이 국민의 모든 목소리를 귀하게 여긴다는 말을 연단에서 읊었다. 하지만 지금 내게 힘을 더하는 목소리 가운데에는 말을 할 수 없는 이들과 애초에 존재하지 않았던 이들이 있다. 기록을 지키는 공직자의 권위가 기록을 위조하는 손을 가리고 있었다."
 fs_constituency_fraud.10.boxes: "투표함을 맡은 자들이 내 쪽 사람과 눈빛을 주고받았다. 태극기와 헌법 앞에서 엄숙하게 봉인한 함이 사람들의 시선에서 멀어진 뒤, 그 자리를 다른 함이 차지했다는 보고가 왔다. 돌아온 함에는 내게 유리한 표가 들어 있었다.\n\n의례의 겉모습은 조금도 흐트러지지 않았다. 진행 요원은 예정된 순서대로 다음 절차를 알렸고 주민들은 봉인에 담긴 공직자의 서약을 믿었다. 그 신뢰를 이용해 국민의 선택을 바꾸었다는 사실만이 장막 뒤에 남았다."
 fs_constituency_fraud.10.counts: "최종 집계를 준비하는 장부가 조용히 내 앞으로 전달되었다. 어떤 표는 다른 이름에 귀속되었고, 어떤 수치는 옮겨 적는 과정에서 달라졌다. 기록을 작성한 자들은 모두 사소한 정정이라 말했지만, 그 정정의 방향은 한결같았다.\n\n곧 공직자들이 헌법 앞에서 결과를 선포할 것이다. 주민들은 낭독되는 숫자를 의례의 결실로 받아들이겠지만, 나는 그 숫자가 어떻게 내 이름으로 모였는지 안다. 잘못된 합계 위에 세운 공직의 권위가 얼마나 오래 버틸지는 아직 알 수 없다."
 fs_constituency_fraud.10.conscience: "\n\n나는 나라를 위한 봉사라는 말로 이 선택을 감쌀 수 있어도, 의례를 더럽혔다는 사실까지 지울 수는 없다."
 fs_constituency_fraud.10.a: "이것이 내가 택한 길이다."

 fs_constituency_fraud.20.t: "신성한 선택에 드리운 의심"
 fs_constituency_fraud.20.intro: "국회의원 선출은 한국교 공동체가 최고위 공직자를 세우는 의례다. 참관인인 나는 연설의 성패만이 아니라 그 의례가 온전히 지켜지는지도 살필 책임이 있다.\n\n[fs_constituency_case_suspect.GetShortUIName]의 주변에서 석연치 않은 이야기가 들려왔다. "
 fs_constituency_fraud.20.bribes: "선물을 받은 주민이 후보의 이름을 유난히 자주 입에 올렸고, 한 증인은 지지 약속과 물품 전달이 같은 자리에서 오갔다고 주장했다. 그러나 오래전의 빚을 갚거나 평소처럼 베푼 것을 매표로 오해했을 가능성도 있다."
 fs_constituency_fraud.20.patronage: "후원과 구휼의 수혜자가 특정 후보의 지지자와 겹친다는 말이 돈다. 당선 뒤의 도움을 약속받았다는 증언도 있지만, 관례적인 부조와 선거를 대가로 한 약속을 구별하려면 당사자들의 설명과 기록을 더 맞춰 보아야 한다."
 fs_constituency_fraud.20.ghosts: "명부에는 사망했다는 주민의 이름이 남아 있고, 같은 사람처럼 보이는 이름이 여러 곳에 적혀 있다. 유령 선거인의 흔적일 수도 있지만, 동명이인이나 오래된 기록, 서로 다른 이름 표기 때문에 생긴 착오일 수도 있다."
 fs_constituency_fraud.20.boxes: "투표함을 옮기던 자들의 동선과 봉인의 상태를 두고 증언이 엇갈린다. 어떤 이는 함이 바뀌었다고 확신하고, 다른 이는 손상된 함을 옮기느라 생긴 소동이라 한다. 주민들이 서약을 믿고 맡긴 표가 그대로 보존되었는지 확인해야 한다."
 fs_constituency_fraud.20.counts: "집계 장부의 수치와 처음 읽힌 표의 수가 맞지 않는다는 주장이 나왔다. 다른 후보에게 돌아갈 표를 옮겨 적었다는 의심과 단순한 기록 정정이라는 해명이 맞선다. 숫자 하나하나의 출처와 이를 확인한 공직자의 진술을 살펴야 한다."
 fs_constituency_fraud.20.doubt: "\n\n의심은 증명이 아니다. 사람을 설득해 증언을 얻고 장부를 꼼꼼하게 대조한다면 진실에 다가갈 수 있다. 그러나 성급한 고발은 결백한 후보의 공직을 향한 길을 막고, 내가 지키려던 의례의 권위마저 훼손할 수 있다."
 fs_constituency_fraud.20.investigate: "증언과 기록을 확인하고, 부정이 드러나면 문제를 제기하겠다."
 fs_constituency_fraud.20.ignore: "확신할 수 없다. 이번에는 넘어가겠다."
 fs_constituency_fraud.21.t: "의심을 따라간 끝에"
 fs_constituency_fraud.21.proved: "흩어진 증언과 기록이 마침내 하나의 범행을 가리켰다. 나는 [fs_constituency_case_suspect.GetShortUIName]의 부정을 의례를 맡은 공직자들 앞에서 공개했다. 이것은 사소한 절차상의 흠이 아니라, 공동체가 최고위 공직자를 선택하는 신성한 과정을 가로챈 일이었다.\n\n범행은 이제 공개 기록에 남는다. 편향된 개최자가 같은 교파의 후보를 감싸더라도, 내가 확인한 사실까지 없던 일로 만들 수는 없다. 헌법 앞에서 참관인의 책임을 다한 대가로 신앙도 +[EmptyScope.ScriptValue('fs_constituency_fraud_report_piety')|0]을 받았다."
 fs_constituency_fraud.21.unresolved: "증언은 마지막 고비에서 흐려졌고, 기록은 내가 내세울 만큼 확실한 결론으로 이어지지 않았다. 석연치 않은 점은 남았지만 의심만으로 [fs_constituency_case_suspect.GetShortUIName](을)를 선거범이라 부를 수는 없었다.\n\n나는 입증하지 못한 주장을 거두었다. 이번 조사에는 보상이나 벌점이 없다. 의례는 계속되며, 밝혀지지 않은 진실도 그 장막 뒤에 남는다."
 fs_constituency_fraud.21.cleared: "기록의 빈칸이 채워지고 증언의 맥락이 드러나자 처음의 의심은 힘을 잃었다. 문제로 보였던 흔적에는 범행과 다른 설명이 있었고, [fs_constituency_case_suspect.GetShortUIName](을)를 고발할 근거는 남지 않았다.\n\n나는 확인한 내용을 공직자들에게 전하고 의심을 거두었다. 부정을 찾아내는 것만큼 결백한 후보를 성급한 단죄에서 지키는 일도 의례를 보전하는 참관인의 책무다."
 fs_constituency_fraud.21.false: "내가 내세운 증언과 기록은 공개된 자리에서 무너졌다. 서로 다른 사정을 범행으로 엮은 것은 나였고, [fs_constituency_case_suspect.GetShortUIName](은)는 내가 주장한 부정을 저지르지 않았다.\n\n헌법의 이름으로 의례를 지킨다는 내 말은 결백한 후보를 모함한 고발이 되어 돌아왔다. 국민 앞에서 신뢰와 경건함을 잃었다. 위신 [EmptyScope.ScriptValue('fs_constituency_false_report_prestige')|0], 신앙도 [EmptyScope.ScriptValue('fs_constituency_false_report_piety')|0]."
 fs_constituency_fraud.21.a: "확인된 사실을 받아들인다."

 fs_constituency_fraud.30.t: "교파의 이익인가, 의례의 정결인가"
 fs_constituency_fraud.30.intro: "[fs_constituency_case_observer.GetShortUIName]의 고발은 단순한 풍문에 머물지 않았다. 증언과 기록이 모였고, 국민의 신성한 선택을 조작한 범행이 의례를 맡은 공직자들 앞에 드러났다.\n\n"
 fs_constituency_fraud.30.self: "그 증거가 가리키는 사람은 바로 나다. 나는 개최자의 권한으로 내 범행을 사소한 착오라 정리할 수도 있다. 그러나 대한민국 헌법을 낭독하게 한 입으로, 헌법 앞에서 저지른 일을 덮으라 명령하는 셈이다."
 fs_constituency_fraud.30.ally: "문제의 후보 [fs_constituency_case_suspect.GetShortUIName](은)는 개최 측과 같은 교파에 속한다. 이번 선거의 진행을 우리에게 유리하게 꾸렸던 내가, 이제는 그 편향이 낳은 범행을 심판해야 한다. 의석을 잃으면 교파의 영향력도 약해질 것이다."
 fs_constituency_fraud.30.choice: "\n\n처벌하면 범인은 주민의 선택으로 이 공직에 오를 자격을 잃고 명예와 헌신이 꺾인다. 대통령의 임명과 훗날의 사면이라는 길은 남는다. 묵인하면 후보는 경쟁을 계속하지만, 이미 공개된 범행은 주민과 다른 교파의 기억에 남는다. 침묵으로 시간을 끌면 단계 마감 때 정해진 처벌이 집행될 것이다."
 fs_constituency_fraud.30.punish: "교파보다 헌법과 의례의 정결이 우선이다. 처벌하라."
 fs_constituency_fraud.30.cover: "국민을 흔들 작은 착오일 뿐이다. 넘어가겠다."
 fs_constituency_fraud_exposed_title: "부정선거가 공개되다"
 fs_constituency_fraud_exposed: "참관인의 조사로 [CHARACTER.GetShortUIName]의 부정이 공개되었다. 최고위 공직자를 세우는 의례의 정당성에 흠이 남았다."
 fs_constituency_fraud_punished_title: "선거범 단죄"
 fs_constituency_fraud_punished: "[CHARACTER.GetShortUIName](이)가 선거범으로 단죄되어 이번 선거의 후보 자격과 사면 전까지의 지역구 피선거권을 잃었다."
 fs_constituency_fraud_covered_title: "개최자가 부정을 묵인함"
 fs_constituency_fraud_covered: "개최자가 [CHARACTER.GetShortUIName]의 공개된 부정을 묵인했다. 후보는 경쟁을 계속하지만 의례의 권위에 대한 의문은 남았다."

 fs_constituency_fraud.40.t: "부정선거! 재선거!"
 fs_constituency_fraud.40.desc: "[fs_constituency_result_seat.GetNameNoTier]의 새 국회의원은 [fs_constituency_result_winner.GetShortUIName]이다. 헌법 앞에서 금배지를 부여받은 당선자는 이제 최고위 공직자들이 모인 국회에 들어가 대통령을 선출할 권한까지 갖는다.\n\n하지만 이번 선거에서는 실제 부정이 드러났다. 다른 교파의 당선자를 두고 내 주변에서는 결과를 순순히 받아들여서는 안 된다는 목소리가 높아진다. 당선자가 직접 부정을 저질렀는지와 별개로, 흠이 드러난 의례가 공직의 권위를 온전히 세울 수 있느냐는 것이다.\n\n물론 재선거를 외쳐도 이미 부여된 의석을 거둘 수는 없다. 다만 공개적인 반발로 당선자의 위신을 깎고, 그 지위에 대한 논란을 오래 남길 수는 있다. 공동체가 겪을 갈등은 내 마음에도 부담이 될 것이다."
 fs_constituency_fraud.40.protest: "부정선거! 재선거!"
 fs_constituency_fraud.40.accept: "절차상 하자는 있었지만, 결과를 받아들이겠다."
 fs_constituency_protest_tt: "#t 당일투표! 수개표! #!"
 fs_constituency_accept_result_tt: "#f 설령 부정선거라 해도, 이제 와서 어쩌겠는가? #!"

 fs_pardon_election_offender_interaction: "선거범 사면"
 fs_pardon_election_offender_interaction_desc: "교계 지도자인 대통령의 권위로 선거범을 완전히 사면합니다. 선거범 특성과 그에 따른 범죄 사유·지역구 출마 금지·대통령 후보 점수 감점을 해제합니다.\n\n이미 잃은 신앙도·위신·명예·헌신 단계와 현재 선거의 실격은 복구하지 않습니다. 의례에서 공개된 사건과 결과 논란도 남습니다."
 fs_pardon_election_offender_interaction_notification: "대통령이 선거범에 대한 사면을 선포했습니다."
 fs_request_election_pardon_interaction: "선거범 사면 청원"
 fs_request_election_pardon_interaction_desc: "청와대의 교계 지도자에게 선거 의례를 더럽힌 죄의 사면을 청합니다. 대통령이 수락하면 선거범 특성이 제거되고 지역구 피선거권이 회복되며 대통령 후보 감점도 사라집니다.\n\n별도 비용은 없으며 같은 대통령에게는 12개월에 한 번 청원할 수 있습니다. 이미 치른 손실과 현재 선거의 실격은 되돌리지 않습니다."
 fs_request_election_pardon_interaction_notification: "선거범이 의례를 더럽힌 죄의 사면과 피선거권 회복을 청원합니다."
 fs_constituency_pardon_granted_title: "선거범 사면 선포"
 fs_constituency_pardon_granted_tt: "대통령의 교계 권위로 선거범 특성과 관련 범죄 사유가 해제되었습니다. 지역구 피선거권과 대통령 후보 점수가 회복됩니다. 과거의 신앙도·위신·단계 손실 및 현재 선거의 실격은 유지됩니다."
 fs_constituency_pardon_refused_title: "사면 청원이 거절되다"
 fs_constituency_pardon_refused_tt: "대통령은 이번에는 죄를 사하지 않았습니다. 선거범 특성과 자격 제한이 유지됩니다. 같은 대통령에게 12개월 뒤 다시 청원할 수 있습니다."
 fs_constituency_pardon_base_reason: "의례를 훼손한 죄의 무게"
 fs_constituency_pardon_same_rite_reason: "같은 교파"
 fs_constituency_pardon_merciful_reason: "자비와 관용"
 fs_constituency_pardon_strict_reason: "단죄와 응보"
 fs_constituency_pardon_rival_reason: "경쟁자 또는 천적"
