 PRK_EXPECTED_SUPPORT_TOOLTIP: "#T 예상 AI 지지#!\n현재 후보와 선거인을 기준으로 AI가 선택할 것으로 예상되는 개발도 가중표입니다.\n\nAI는 의견, 친구·연인·가족·경쟁 관계, 같은 가문, 신앙 적대도, 문화, 능력치, 정통성·위신, 성격 특성, 현직 주석·부주석 여부를 평가합니다.\n\n#weak 실제 선거 전 상황이 바뀌거나 최고 점수가 동률이면 결과가 달라질 수 있습니다. 투표가 시작된 뒤에는 동결된 AI 선택을 표시합니다.#!"
