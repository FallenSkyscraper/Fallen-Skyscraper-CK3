 PRK_ELECTORATE_FORMULA: "각 선거인의 표는 직접 보유한 모든 백작령의 개발도를 합산합니다. 나의 현재 선거인단 표: #P [GetPlayer.MakeScope.Var('fs_prk_ui_my_electoral_votes').GetValue|0]표#!"
 PRK_ELECTOR_BREAKDOWN_TITLE: "선거인단 표 산출 내역"
 PRK_ELECTOR_BREAKDOWN_HINT: "각 선거인이 직접 보유한 백작령의 개발도 합계입니다."
 PRK_ELECTOR_VOTE_BREAKDOWN: "직할 백작령 개발도 합계: #P [Character.MakeScope.Var('fs_prk_ui_electoral_votes').GetValue|0]표#!"
 PRK_CANDIDATE_IDENTITY: "[Character.Custom('GetGovernmentIcon')] [Character.GetGovernment.GetNameNoTooltip] · [Character.GetFaith.GetTextIcon] [Character.GetFaith.GetNameNoTooltip]"
 PRK_CANDIDATE_SKILLS: "@skill_diplomacy_icon! [Character.GetSkill( 'diplomacy' )]  @skill_martial_icon! [Character.GetSkill( 'martial' )]  @skill_stewardship_icon! [Character.GetSkill( 'stewardship' )]  @skill_intrigue_icon! [Character.GetSkill( 'intrigue' )]  @skill_learning_icon! [Character.GetSkill( 'learning' )]"
 PRK_CANDIDATE_STANDING: "[legitimacy_i] 정통성 [Character.GetLegitimacyLevel.GetIndex] · @prestige_level_[Character.GetPrestigeLevel]_icon! [GetPrestigeLevelName( Character.GetPrestigeLevel )]"
 PRK_CANDIDATE_PLAYER_OPINION: "나와의 관계: [GetPlayer.Custom2('RelationToMe', Character.Self)] · [opinion_i] 의견 [GetPlayer.GetOpinionOf( Character.Self )|+=0]"
 PRK_EXPECTED_AI_SUPPORT: "예상 AI 지지: #P [Character.MakeScope.Var('fs_prk_ui_expected_ai_votes').GetValue|0]표#!"
 PRK_EXPECTED_SUPPORT_TOOLTIP: "#T 예상 AI 지지#!\n현재 후보와 선거인을 기준으로 AI가 선택할 것으로 예상되는 개발도 가중표입니다.\n\nAI는 의견, 친구·연인·가족·경쟁 관계, 같은 가문, 신앙 적대도, 문화, 능력치, 정통성·위신, 성격 특성, 현직 주석·부주석 여부와 선거운동 성과를 평가합니다.\n\n#weak 실제 선거 전 상황이 바뀌거나 최고 점수가 동률이면 결과가 달라질 수 있습니다. 투표가 시작된 뒤에는 동결된 AI 선택을 표시합니다.#!"
 PRK_CANDIDATE_ELECTORAL_VOTES: "본인 보유 선거인단 표: #V [Character.MakeScope.Var('fs_prk_ui_electoral_votes').GetValue|0]표#!"
 PRK_CURRENT_RECORDED_VOTES: "현재 반영표: #P [Character.MakeScope.Var('fs_prk_election_votes').GetValue|0]표#!"
 PRK_RUN_CANDIDATE: "출마"
 PRK_RESIGN_CANDIDATE: "사퇴"
 PRK_MY_VOTES: "나의 표: #P [GetPlayer.MakeScope.Var('fs_prk_election_voting_power').GetValue|0]#!"
 PRK_PENDING_VOTER_COUNT: "아직 투표하지 않은 플레이어 선거인: #V [GetGlobalVariable('fs_prk_election_pending_player_count').GetValue|0]명#!"
 PRK_PENDING_VOTERS: "응답 대기 중"
 PRK_ELECTION_INSTRUCTIONS: "후보 한 명에게 보유한 표를 모두 행사하거나 기권하십시오. 한 번 선택하면 변경할 수 없습니다."
 PRK_VOTE: "#P 투표#!"
 PRK_ABSTAIN: "기권"
 PRK_VOTE_TOOLTIP: "선택한 후보에게 보유한 표를 모두 행사합니다."
 PRK_ABSTAIN_TOOLTIP: "이번 선거에서 표를 행사하지 않고 기권합니다."
 PRK_CONFIRM_VOTE_TEXT: "[GetPlayer.MakeScope.Var('fs_prk_pending_vote_candidate').GetCharacter.GetFullNameNicknamedNoTooltip]에게 #P [GetPlayer.MakeScope.Var('fs_prk_election_voting_power').GetValue|0]표#!를 모두 행사하시겠습니까?"
 PRK_CONFIRM_ABSTENTION_TEXT: "이번 선거에서 보유한 #P [GetPlayer.MakeScope.Var('fs_prk_election_voting_power').GetValue|0]표#!를 행사하지 않고 기권하시겠습니까?"
 PRK_CONFIRM_SELECTION_WARNING: "#weak 확인 후에는 선택을 변경할 수 없습니다.#!"
 PRK_CONFIRM: "확인"
 PRK_CANCEL: "취소"
 RESIGN_CANDIDATE_TOOLTIP: "다음 선거의 후보 등록을 취소합니다. 이미 소모한 금과 위신은 반환되지 않습니다."
 RUN_CANDIDATE_TOOLTIP: "선거 출마 등록에는 100 [gold|E][gold_i] 및 100 [prestige|E][prestige_i]가 소모됩니다. 다만 자금이 조금 부족하더라도 등록할 수 있도록 80 [gold|E][gold_i] 이상이면 출마할 수 있습니다.\n출마자는 성인이며 투옥되지 않은 공화국 구성원이어야 합니다.\n또한 [prestige_level|E] [GetModifier('prestige_level_1').GetNameWithTooltip|L]가 필요합니다.\n투표가 시작되기 전에는 언제든 출마를 취소할 수 있지만, 소모한 자금과 위신은 반환되지 않습니다."
 PRK_ELECTION_TITLE: "조선 인민 공화국 선거"
 joson_election.4.t: "선거 결과"
 joson_election.4.desc: "[fs_prk_result_notice_year.GetValue|0]년에 실시된 공화국 선거에서, #P [fs_prk_result_notice_votes.GetValue|0]#!표를 얻은 [fs_prk_winner.GetFirstNameNicknamedOrMe](이)가 당선되었습니다.\n새 주석에게 축하를!"
 joson_election.4.a: "야호!"
 joson_election.4.b: "그렇게 됐군."
 joson_election.4.c: "다음엔 꼭..."
 joson_election.4.c.tooltip: "다음 선거에 출마합니다"
 joson_election.8.t: "주석직 승계"
 joson_election.8.desc: "국가주석의 유고에 따라 현직 부주석 [fs_prk_interim_successor.GetFirstNameNicknamedOrMe](이)가 임시 주석으로서 남은 임기를 승계했습니다.\n예정된 정기 선거 일정은 그대로 유지됩니다."
 joson_election.8.a: "헌정 질서는 계속된다."
 joson_election.9.t: "주석 유고와 특별선거"
 joson_election.9.desc: "국가주석의 유고가 발생했으나 직무를 승계할 부주석이 없습니다. [fs_prk_interim_successor.GetFirstNameNicknamedOrMe](이)가 임시 주석직을 맡았으며, 새 주석을 선출하기 위한 특별선거가 90일 이내에 실시됩니다.\n특별선거 당선자는 현재 임기의 남은 기간만 수행합니다."
 joson_election.9.a: "선거를 준비하라."
 joson_election.10.t: "선거운동의 시작"
 joson_election.10.desc: "선거가 다가오면서 후보의 이름만 등록해 두는 것으로는 부족해졌습니다. 유권자와 선거인들이 [ROOT.GetFirstNameNicknamedOrMe]의 비전과 능력을 믿게 만들 선거운동 방식을 정해야 합니다."
 joson_election.10.a: "전국적인 유세 조직을 가동한다."
 joson_election.10.a.tt: "75 [gold|E][gold_i]를 들여 선거운동에 따른 AI 후보 평가 점수를 #P +20#! 얻음"
 joson_election.10.b: "정책 선언과 명망에 집중한다."
 joson_election.10.b.tt: "100 [prestige|E][prestige_i]를 들여 선거운동에 따른 AI 후보 평가 점수를 #P +12#! 얻음"
 joson_election.10.c: "기존 조직과 평판에 의지한다."
 joson_election.10.c.tt: "추가 비용 없이 선거운동에 따른 AI 후보 평가 점수를 #P +5#! 얻음"
 joson_election.10.d: "선거 일정이 바뀌었으니 일단 해산한다."
 joson_election.11.t: "공개 정책 토론"
 joson_election.11.desc: "공화국의 선거인들이 지켜보는 공개 토론이 열렸습니다. 모든 의제를 다룰 수는 없습니다. [ROOT.GetFirstNameNicknamedOrMe]의 강점을 가장 잘 드러낼 분야에 논의를 집중해야 합니다."
 joson_election.11.a: "행정 계획과 정책의 세부를 설명한다."
 joson_election.11.a.tt: "[stewardship|E]과 [learning|E]에 따라 AI 후보 평가 점수를 #P +2~+12#! 얻음"
 joson_election.11.b: "비전과 통합의 메시지로 청중을 설득한다."
 joson_election.11.b.tt: "[diplomacy|E]에 따라 AI 후보 평가 점수를 #P +2~+12#! 얻음"
 joson_election.11.c: "상대 후보들의 모순과 약점을 파고든다."
 joson_election.11.c.tt: "50 [prestige|E][prestige_i]를 잃고 [intrigue|E]에 따라 AI 후보 평가 점수를 #P +2~+12#! 얻음"
 joson_election.11.d: "토론은 이미 취소되었다."
 run_for_presidency_decision: "국가주석 선거에 출마"
 run_for_presidency_decision_desc: "공화국의 차기 국가주석이 되기 위해 선거 후보로 등록합니다."
 run_for_presidency_decision_tooltip: "국가주석 선거 후보로 등록합니다."
 run_for_presidency_decision_confirm: "선거에 출마하겠다"
 delay_election_decision: "선거 연기"
 delay_election_decision_desc: "주석 선거는 원래 정기적으로 실시되어야 하지만, 중대한 사유가 있다면 한 차례 연기할 수 있다. 다만 봉신들은 좋아하지 않을 것이다..."
 delay_election_decision_tooltip: "이번 정기 선거를 4년 뒤로 한 차례 연기한다."
 delay_election_decision_tt: "이번 정기 선거를 4년 뒤로 미룸"
 delay_election_decision_tt2: "평화 상태에서 선거를 연기하면 명예 단계가 #N 1#!만큼 하락합니다!"
 delay_election_decision_confirm: "선거를 연기하자"
 fs_prk_election_delay_requires_idle_tt: "선거가 진행 중이지 않음"
 fs_prk_election_delay_once_per_cycle_tt: "이번 정기 선거를 아직 연기하지 않음"
 vice_presidency_diarchy_type: "부주석 제도"
 appoint_vice_president_interaction: "부주석 임명"
 appoint_vice_president_interaction_desc: "유사시 주석직을 승계하고 평시에 주석의 업무를 보좌할 부주석을 지명합니다."
 recipient_secondary_appoint_vice_president_interaction: "부주석 지명자"
 vice_presidency_diarch_title: "부주석"
