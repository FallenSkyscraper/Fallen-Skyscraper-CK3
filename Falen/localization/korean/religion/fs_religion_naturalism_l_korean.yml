l_korean:

 # Source: common/religion/religion_types/fs_naturalism.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Religion: naturalism_religion
 naturalism_religion: "자연교"
 naturalism_religion_adj: "자연교"
 naturalism_religion_adherent: "자연교인"
 naturalism_religion_adherent_plural: "자연교인"
 naturalism_religion_desc: "자연교는 '사건' 이후 고대 한국과 고대 북조선의 경계의 때묻지 않은 자연으로 피신한 사람들로부터 시작되었습니다. 자연교는 세상이 혼란하고 수많은 사람들이 도탄에 빠진 이유가 문명에 과하게 의존하고 그것을 허투루 썼기 때문이라고 믿습니다. 자연은 언제나 인간의 보호자였으며, 인간이 그간 자연을 무시하고 존중하지 않았기에 그 대가를 치른 것입니다. 언제나 자연이 우선입니다."

 # Faith: naturalism
 naturalism: "자연 신앙"
 naturalism_adj: "자연 신앙"
 naturalism_adherent: "자연 신앙인"
 naturalism_adherent_plural: "자연 신앙인"
 naturalism_desc: "사건 이후 산으로 들어간 사람들은 인간의 도덕을 잊고 살아가게 되었습니다. 그곳에서 통용되는 단 하나의 도덕은 약육강식입니다. 그것이 곧 자연입니다."

 # Reformation: naturalism
 naturalism_old: "원시 자연 신앙"
 naturalism_old_adj: "원시 자연"
 naturalism_old_adherent: "원시 자연 추종자"
 naturalism_old_adherent_plural: "원시 자연 추종자"
 naturalism_old_desc: "원시적인 자연의 힘을 믿는 자들은 감히 자연의 것을 취해 인간의 배를 불리는 것은 극도로 불경한 것이라 믿고 있습니다. 특성상 이들의 기술력은 존재하지 않다고 봐도 무방하지만, 기이하게도 그 신앙을 잘 보존하고 있는 편입니다."
