 hamheung_rite_desc:0 "함흥 지역의 사제들은 외지인인 극동대주교의 수위권을 거부하였습니다. 그들은 함흥대주교좌의 한국인 대주교가 함흥정교회를 이끌어야 한다고 주장합니다."

