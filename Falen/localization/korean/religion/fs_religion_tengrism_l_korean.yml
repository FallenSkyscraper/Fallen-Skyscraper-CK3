l_korean:

 # Source: common/religion/religion_types/00_tengrism.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Faith: tengri_pagan
 tengri_pagan: "텡그리"
 tengri_pagan_adj: "텡그리"
 tengri_pagan_adherent: "텡그리 신도"
 tengri_pagan_adherent_plural: "텡그리 신도"
 tengri_pagan_desc: "텡그리는 곧 하늘입니다. 초원을 달리며 살아가는 사람들에게 푸르른 하늘과 그 아래 초지는 모두 텡그리의 주재 하에 있습니다. 모든 유목민은 하늘에서 태어나 하늘로 돌아갑니다."

 # Reformation: tengri_pagan
 tengri_pagan_old: "옛 텡그리 신앙"
 tengri_pagan_old_adj: "옛 텡그리"
 tengri_pagan_old_adherent: "옛 텡그리 신도"
 tengri_pagan_old_adherent_plural: "옛 텡그리 신도"
 tengri_pagan_old_desc: "텡그리는 초원과 하늘을 어우르는 신성하고 위대한 존재이며, 그 뜻을 점지하는 것은 감히 상상도 못할 정도입니다. 그것이 전통이며, 전통은 신성하기에 바뀌어질 수 없습니다."
