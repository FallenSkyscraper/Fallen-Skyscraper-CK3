 # Religion: mechanism_religion
 mechanism_religion: "기계교"
 mechanism_religion_adj: "기계교"
 mechanism_religion_adherent: "공학도"
 mechanism_religion_adherent_plural: "공학도"
 mechanism_religion_desc: "태초에 위대한 시계공께서 세상이라는 거대한 기계장치를 창조하셨습니다. 이들은 그렇기에 기계와 공학을 탐구하는 것이야말로 세상과 신에 대한 지식을 얻을 수 있는 가장 확실한 방법이라 믿어 의심치 않습니다."

