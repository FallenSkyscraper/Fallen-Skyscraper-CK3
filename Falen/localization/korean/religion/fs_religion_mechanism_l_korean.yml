 # Rite: holy_mechanism
 holy_mechanism: "신성 기계교"
 holy_mechanism_adj: "신성 기계교"
 holy_mechanism_adherent: "신성 기계교인"
 holy_mechanism_adherent_plural: "신성 기계교인"
 holy_mechanism_desc: "태초에 하나님이 천지를 창조하실 때에 하나님이 자와 컴퍼스를 들고 세상이라는 기계를 설계하셨습니다. 그러므로 신성 기계교도들은 성경에 근거하여 기계를 탐구함으로써 그분이 창조하신 우주만물의 이치를 밝혀나갈 수 있다고 믿습니다."

 # Rite: apologetics_mechanism
