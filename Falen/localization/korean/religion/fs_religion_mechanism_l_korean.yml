 apologetics_mechanism_adj: "호교론 기계교"
 apologetics_mechanism_adherent: "호교론 기계교인"
 apologetics_mechanism_adherent_plural: "호교론 기계교인"
 apologetics_mechanism_desc: "태초에 위대한 설계자께서 \"print(\"hello world\")\"라 하시매 세상이 생겨났습니다. 고대인들은 이 거룩한 신의 언어를 기록으로 남겼으니, 호교론 기계교도들은 이 언어를 잘 해석하고 그 논리를 낱낱이 밝힘으로써 우주의 구조와 신의 존재를 증명할 수 있다고 믿습니다."

