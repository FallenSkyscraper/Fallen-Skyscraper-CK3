l_korean:

 # Source: common/religion/religion_types/00_islam.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Religion: islam_religion
 islam_religion_desc: "이슬람교는 선지자 무함마드가 설파한 아브라함 신앙 최후의 계시이자 신의 말씀이 인도하는 대로 따르는 신앙입니다. 놀랍게도 신앙의 불모지이자 적대자가 가득한 이곳에서 그들은 자신들의 신앙을 지켜내었습니다."

 # Faith: muttahida
 muttahida: "무타히다파"
 muttahida_adj: "무타히다파"
 muttahida_adherent: "무타히다인"
 muttahida_adherent_plural: "무타히다인"
 muttahida_desc: "무타히다파는 사건 이후 전해져 내려오던 이슬람의 여러 종파들을 모아 생겨난 종파입니다. 이들은 한국의 관습에도 어느 정도 맞추어졌기에, 수백 년간의 세월 동안 끊어지지 않고 유지될 수 있었습니다."

 # Religion and faith terminology
 islam_high_god_name: "하느님"
 islam_high_god_name_alternate: "알라"
 islam_high_god_name_alternate_possessive: "알라의"
 islam_high_god_name_possessive: "하느님의"
