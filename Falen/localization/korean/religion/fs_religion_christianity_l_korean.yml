l_korean:

 # Source: common/religion/religion_types/00_christianity.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Faith: protestant
 protestant: "개신교"
 protestant_adj: "개신교"
 protestant_adherent: "개신교인"
 protestant_adherent_plural: "개신교인"
 protestant_desc: "개신교는 참된 믿음과 성서를 기반으로 널리퍼진 기독교의 한 종파중 하나입니다. 신의 구원은 만민에게 보장된 권리라고 믿고 있으며, 각 교회는 평등한 것이 마땅하다고 여깁니다. 설령 어리석은 양이 불신자의 길로 빠진다고 하여 그것을 저주하지 않고 목자의 입장에서 최대한 설득과 교화를 하는 것을 원칙으로 삼고 있습니다. 그 '설득'과 '교화'의 방식은 모두 생각이 다르지만요."

 # Faith: imperial_church
 imperial_church: "제국국교회"
 imperial_church_adj: "제국국교회"
 imperial_church_adherent: "제국국교도"
 imperial_church_adherent_plural: "제국국교인"
 imperial_church_desc: "신성복음제국의 3대 황제 이제용이 창시한 제국국교회는 거대한 제국을 하나로 묶어주는 구심점이자 황제에 의해 굴러가는 거대한 톱니바퀴입니다. 익산 법왕부가 이들을 통제하며 법왕은 황제 아래 존재합니다. 제국의 안녕은 국교회를 필요로 합니다."

 # Rite: hamheung_rite
 hamheung_rite: "함흥 예법"
 hamheung_rite_adj: "함흥"
 hamheung_rite_adherent: "함흥정교회 신도"
 hamheung_rite_adherent_plural: "함흥정교회 신도"
 hamheung_rite_desc: "함흥 지역의 사제들은 외지인인 극동대주교의 수위권을 거부하였습니다. 그들은 함흥대주교좌의 한국인 대주교가 함흥정교회를 이끌어야 한다고 주장합니다."

 # Rite: primorsky_rite
 primorsky_rite: "프리모리예 예법"
 primorsky_rite_adj: "프리모리예"
 primorsky_rite_adherent: "러시아 정교회 신도"
 primorsky_rite_adherent_plural: "러시아 정교회 신도"
 primorsky_rite_desc: "사도 니콘에 의해 극동에서 새롭게 탄생한 정교회는 블라디보스토크에 위치한 극동대주교좌의 영향력 아래에 있습니다. 이제 정교회는 로마 교황청을 모방하여 하나의 총대주교좌를 중심으로 한 수직적 질서를 가집니다."

 # Rite: presbyterianism
 presbyterianism: "장로회"
 presbyterianism_adj: "장로회"
 presbyterianism_adherent: "장로회 신자"
 presbyterianism_adherent_plural: "장로회 신자"
 presbyterianism_desc: "장로회는 칼뱅주의적인 개신교의 한 종파입니다. 칼뱅주의의 신학을 요약하자면, 오직 성서를 바탕으로 한 믿음과 인간의 절대적인 선택이 핵심입니다. 장로회는 뜻 있고 존경받는 장로가 중심인 구조이며, 목사도 하나의 '장로'입니다. 이들 '장로'들이 앞장서서 한반도에 성서의 믿음을 전파하고 있습니다."

 # Rite: lutheran
 lutheran: "루터교회"
 lutheran_adj: "루터교회"
 lutheran_adherent: "루터교회 신자"
 lutheran_adherent_plural: "루터교회 신자"
 lutheran_desc: "루터교회는 천주교의 타락에 맞선 마르틴 루터의 가르침을 가장 근본적으로 따르는 개신교의 한 종파입니다. 천주교의 수직적 구조에 반발하여 각 교회의 자치를 폭넓게 인정하는 개교회주의를 강조하며, 성상의 급격한 배제를 부르짖고 있습니다. 이들은 천주교에 가장 강력한 적대자이며, 혼란한 세상에서 기꺼이 신앙을 위해 몸을 바칠 것입니다."

 # Rite: anglican
 anglican: "성공회"
 anglican_adj: "성공회"
 anglican_adherent: "성공회 교도"
 anglican_adherent_plural: "성공회 교도"
 anglican_desc: "성공회는 개혁하는 보편교회로써, 성스런 칠대성사의 전례를 따릅니다. 비록 그 시작은 권력자들의 개인적 다툼이라 하더라도 성공회는 누구건 차별하지 않고 관대하게 받아들일 것입니다. 성공회 역시 성경을 우선시하고, 천주교와의 단절을 추구하지만, 이들이 진정으로 '개혁교회'인지는 다른 교파들로부터 논쟁이 존재합니다."

 # Rite: methodism
 methodism: "감리회"
 methodism_adj: "감리회"
 methodism_adherent: "감리회 신자"
 methodism_adherent_plural: "감리회 신자"
 methodism_desc: "감리회는 복음주의적인 개신교의 한 종파입니다. 성공회의 경직성과 한계에 실망한 뜻있는 신자들이 만든 감리회는 인간의 자유의지를 바탕으로 만인이 속죄하는 것이 진정한 구원에 이르는 유일한 길이라고 믿고 있습니다. 이들은 선행은총으로 타락했던 인간의 의지를 다시 하나님께 되돌리는 것을 목적으로 삼고 있습니다. 감리회는 세상이 구원받는 그날까지 '선행은총'을 포기하지 않을 것입니다. "

 # Rite: baptism
 baptism: "침례회"
 baptism_adj: "침례회"
 baptism_adherent: "침례회 신자"
 baptism_adherent_plural: "침례회 신자"
 baptism_desc: "침례회는 청교도적인 신학을 따르는 개신교의 한 종파입니다. 독특하게도, 침례회는 진정한 자기 의지로 하나님께 투신하는 사람들이 진정한 신앙을 가지고 있다고 믿기에, 신앙의 자유에 어느정도 관대한 면이 있습니다. 이들에겐 사제나 신부가 존재하지 않으며, '신학의 자유'가 가장 중요하다고 믿습니다. 그렇기에 침례회는 다른 교단과 마찰이 잦으며, '선택적인 교리'의 부작용도 큰 편입니다."

 # Rite: holy_spirit
 holy_spirit: "성령교"
 holy_spirit_adj: "성령교"
 holy_spirit_adherent: "성령교도"
 holy_spirit_adherent_plural: "성령교인"
 holy_spirit_desc: "성령교는 국교회의 성립에 자신들의 마땅한 권리를 박탈당한 목사들이 이룬 종파입니다. 그들은 자신의 교회에 대하여 절대적인 지배권을 행사하며 성경의 해석에 대한 신성한 권리를 부여받았다 주장합니다."

 # Rite: minjung_prot
 minjung_prot: "민중신학"
 minjung_prot_adj: "민중신학"
 minjung_prot_adherent: "민중신학 신자"
 minjung_prot_adherent_plural: "민중신학 신자"
 minjung_prot_desc: "민중신학은 고난받는 민중의 삶에서 하나님의 뜻을 찾는 개신교의 가르침입니다. 신도들은 억압받는 사람들과 함께하며 공동체의 존엄과 해방을 추구합니다."

 # Rite: jeonju_rite
 jeonju_rite: "전주 예법"
 jeonju_rite_adj: "전주"
 jeonju_rite_adherent: "전주 기독교도"
 jeonju_rite_adherent_plural: "전주 기독교도"
 jeonju_rite_desc: "$imperial_church_desc$"

 # Rite: holyist
 holyist: "신성교"
 holyist_adj: "신성교"
 holyist_adherent: "신성교도"
 holyist_adherent_plural: "신성교인"
 holyist_desc: "이들은 제국교의 타락을 규탄하면서 일어선 자들로, 일명 신성혁명의 주동자들입니다."

