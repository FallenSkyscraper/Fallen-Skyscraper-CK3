 # Religion: cheondo_religion
 cheondo_religion: "천도교"
 cheondo_religion_adj: "천도교"
 cheondo_religion_adherent: "천도교인"
 cheondo_religion_adherent_plural: "천도교인"
 cheondo_religion_desc: "천도교는 수운 최제우가 창시한 동학을 기원으로 하는 종교입니다. 오랜 고난과 핍박을 견뎌온 이들에게 다시 한 번 기회가 찾아왔고, 천도교도들은 새로운 동학을 일으키고자 합니다."

 # Faith: cheondo_faith
 cheondo_faith: "천도교"
 cheondo_faith_adj: "천도교"
 cheondo_faith_adherent: "천도교인"
 cheondo_faith_adherent_plural: "천도교인"
 cheondo_faith_desc: "사건 이후 천도교는 빠른 속도로 북한 지역을 장악하였습니다. 무너져내린 백두혈통의 신화를 채워준 것은 한울님의 지극히 넓은 마음이었습니다."

