 cheondo_desc: "사건 이후 천도교는 빠른 속도로 북한 지역을 장악하였습니다. 무너져내린 백두혈통의 신화를 채워준 것은 한울님의 지극히 넓은 마음이었습니다."

 # Rite: cheonjin
