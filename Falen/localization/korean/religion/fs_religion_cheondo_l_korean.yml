 cheonjin_adherent: "천진교인"
 cheonjin_adherent_plural: "천진교인"
 cheonjin_desc: "동북의 척박한 땅에서 천진교는 중앙 교단과 갈라지게 되었습니다. 비록 그들이 함께하지는 못하게 되었지만, 위태로운 그들은 언제나 열우들을 그리워합니다."

