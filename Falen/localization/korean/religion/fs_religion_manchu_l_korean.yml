 aisin_gioro_adherent_plural: "아이신기오로 숭배 신도"
 aisin_gioro_desc: "사건 발생 후 광대한 만주에는 오로지 세 뿌리만이 남게 되었습니다. 이들은 아이신기오르로 내려오는 청의 후예라 여겨지고 있습니다."

