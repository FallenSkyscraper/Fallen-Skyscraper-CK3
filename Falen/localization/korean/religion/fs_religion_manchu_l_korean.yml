 # Religion: manchu_religion
 manchu_religion: "만주"
 manchu_religion_adj: "만주"
 manchu_religion_adherent: "만주 신앙인"
 manchu_religion_adherent_plural: "만주 신앙인"
 manchu_religion_desc: "사건 발생 이후 만주의 광대한 초원에는 옛 만주족의 정체성을 자처하는 이들이 주류를 이루게 되었습니다. 그들은 부족을 위한 땅을 차지하기 위한 각축전의 일환으로 혈통을 강조하게 되었고, 이윽고 조상 숭배 중심의 신앙을 발달시켰습니다."

