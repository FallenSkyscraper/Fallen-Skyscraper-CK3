l_korean:

 # Source: common/religion/religion_types/00_muism.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Faith: mu_pagan
 mu_pagan: "무속"
 mu_pagan_adj: "무속"
 mu_pagan_adherent: "무속인"
 mu_pagan_adherent_plural: "무속인"
 mu_pagan_desc: "태초에 사람이 이 세상에 날 때부터 하늘은 무당을 통해 세상을 이롭게 했었습니다. 하늘과 사람을 이어주는 박수무당을 통해 전해지는 이 믿음은 아주 오래된 것입니다. 한반도의 모든 지배자, 종교인은 물론이고 어린아이부터 노인까지 모두 그 근본에 무속을 품고 살아갑니다. 단지 그것을 깨달은 것은 소수일 뿐입니다."

 # Reformation: mu_pagan
 mu_pagan_old: "옛 무속"
 mu_pagan_old_adj: "옛 무속"
 mu_pagan_old_adherent: "$mu_pagan_adherent$"
 mu_pagan_old_adherent_plural: "$mu_pagan_adherent_plural$"
 mu_pagan_old_desc: "$mu_pagan_desc$"

 # Faith: jeju_pagan
 jeju_pagan: "하르방교"
 jeju_pagan_adj: "하르방교"
 jeju_pagan_adherent: "하르방교인"
 jeju_pagan_adherent_plural: "하르방교인"
 jeju_pagan_desc: "제주의 사람들은 돌하르방을 세워 자신들의 복과 안녕을 빌었습니다. 사건 이후 마을마다 저마다의 하르방이 세워졌고 하르방의 크기와 동원되는 사람들의 수는 곧 마을의 권위를 상징합니다."

 # Rite: hereditary_mu
 hereditary_mu: "세습무"
 hereditary_mu_adj: "세습무"
 hereditary_mu_adherent: "세습무 신도"
 hereditary_mu_adherent_plural: "세습무 신도"
 hereditary_mu_desc: "세습무는 집안에서 대대로 전해 온 무속의 의례와 가르침을 잇는 무당입니다. 전승된 굿과 마을의 관습을 지키며 사람과 신령 사이를 이어 줍니다."

 # Rite: possessed_mu
 possessed_mu: "강신무"
 possessed_mu_adj: "강신무"
 possessed_mu_adherent: "강신무 신도"
 possessed_mu_adherent_plural: "강신무 신도"
 possessed_mu_desc: "강신무는 신령이 몸에 내려오는 체험을 통해 하늘과 사람을 잇는 무당입니다. 신령의 뜻을 전하고 굿을 통해 사람들의 복과 안녕을 빕니다."

 # Rite: simbang_mu
 simbang_mu: "심방"
 simbang_mu_adj: "심방"
 simbang_mu_adherent: "심방 신도"
 simbang_mu_adherent_plural: "심방 신도"
 simbang_mu_desc: "심방은 제주에서 신령의 이야기를 전하고 굿을 집전하는 무당입니다. 마을과 집안의 안녕을 빌며 섬의 오랜 무속 전통을 이어 갑니다."
