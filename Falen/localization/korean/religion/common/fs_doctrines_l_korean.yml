 # Sources: common/religion/doctrine_group_types, common/religion/doctrine_types

 # Group: terror_governing
 terror_governing_name: "공포정치"

 # special_doctrine_terror_governing
 special_doctrine_terror_governing_name: "공포정치"
 special_doctrine_terror_governing_desc: "강력한 법과 공포 아래 통치를 이어나갈 때야 말로 가장 안정적이고 우월한 체제가 세워집니다."

 # Group: path_of_saint
 path_of_saint_name: "위대한 성현의 길"

 # special_doctrine_path_of_saint
 special_doctrine_path_of_saint_name: "위대한 성현의 길"
 special_doctrine_path_of_saint_desc: "거성 안악의 길을 뒤쫓다 보면, 어느 순간 난세를 끝내고 치세를 다시 시작할 수 있게 될 것입니다."

 # Group: hundred_days_of_reform
 hundred_days_of_reform_name: "변법자강"

 # special_doctrine_hundred_days_of_reform
 special_doctrine_hundred_days_of_reform_name: "변법자강"
 special_doctrine_hundred_days_of_reform_desc: "공양학파는 좀 더 나은 세상을 만들기 위해 끊임없이 신문물을 받아들이고, 개혁해 나갈 것입니다."

 # Group: is_koreanism_faith
 is_koranism_faith_name: "대한민국 정신"

 # special_doctrine_is_koreanism_faith
 special_doctrine_is_koreanism_faith_name: "대한민국 정신"
 special_doctrine_is_koreanism_faith_desc: "대한민국은 이 땅에 존재했던 가장 찬란한 문명이었습니다. 우리는 대한민국의 헌정 질서를 언젠가 다시 세우고, 이 땅에 문명을 다시금 이룩할 것입니다. 비록 그 헌정 질서가 무엇인지는 의견 차이가 있지만요."

 # Group: is_communism_faith
 is_communism_faith_name: "마르크스의 가르침"

 # special_doctrine_is_communism_faith
 special_doctrine_is_communism_faith_name: "마르크스의 가르침"
 special_doctrine_is_communism_faith_desc: "위대한 선지자인 마르크스의 가르침을 토대로, 이들은 이상적인 공산 사회를 건설하고자 합니다. 비록 세부적인 방법이 다르다 하더라도, 이들이 같은 목표를 향하고 있다는 사실은 변하지 않습니다."

 # Group: is_manchurian_faith
 is_manchurian_faith_name: "만신전의 후예"

 # special_doctrine_is_manchurian_faith
 special_doctrine_is_manchurian_faith_name: "만신전의 후예"
 special_doctrine_is_manchurian_faith_desc: "이들은 옛 고향에 있던 만신전의 후예들로써, 비록 지금은 그 중 하나의 신 밖에 모시진 않지만 그들의 근본은 만신전의 있다는 것은 영원토록 잊혀지지 않을 것입니다."

 # Group: is_tengri_faith
 is_tengri_faith_name: "텡그리의 자손들"

 # special_doctrine_is_tengri_faith
 special_doctrine_is_tengri_faith_name: "텡그리의 자손들"
 special_doctrine_is_tengri_faith_desc: "이들은 스스로를 텡그리의 후예라고 자칭합니다. 그들은 초원을 거닐면서 그들의 전승을 자식들에게 가르치며 살아갑니다."

 # Group: is_confucian_faith
 is_confucian_faith_name: "공자의 가르침"

 # special_doctrine_is_confucian_faith
 special_doctrine_is_confucian_faith_name: "공자의 가르침"
 special_doctrine_is_confucian_faith_desc: "세상에는 마땅히 해야 할 도리가 있고, 따라야 할 법도가 있습니다. 선현 공자깨서 정리한 이 사상을 우리는 계속해서 이어 나가야 합니다."

 # Group: the_pantheon
 the_pantheon_name: "만신전"

 # special_doctrine_aisingioro_worship
 special_doctrine_aisingioro_worship_name: "아이신기오로 숭배"
 special_doctrine_aisingioro_worship_desc: "아이신기오로 씨족은 건주의 작은 부족에서 일어나, 청나라를 세우고 중국과 그 주변을 다스렸습니다. 우리는 이들의 후예로써 조상의 길을 따라야 합니다."

 # special_doctrine_wanyan_worship
 special_doctrine_wanyan_worship_name: "완안 숭배"
 special_doctrine_wanyan_worship_desc: "완안 숭배"

 # special_doctrine_khan_worship
 special_doctrine_khan_worship_name: "대칸 숭배"
 special_doctrine_khan_worship_desc: "우리는 몽골 제국을 세운 칭기즈 칸의 후예입니다."

 # special_doctrine_cheewoo_worship
 special_doctrine_cheewoo_worship_name: "치우 숭배"
 special_doctrine_cheewoo_worship_desc: "치우 숭배"

 # special_doctrine_munsunjae_worship
 special_doctrine_munsunjae_worship_name: "문선제 숭배"
 special_doctrine_munsunjae_worship_desc: "문선제 숭배"

 # special_doctrine_yingzhao_worship
 special_doctrine_yingzhao_worship_name: "시황제 숭배"
 special_doctrine_yingzhao_worship_desc: "시황제 숭배"

 # special_doctrine_sinnong_worship
 special_doctrine_sinnong_worship_name: "신농 숭배"
 special_doctrine_sinnong_worship_desc: "신농 숭배"

 # Group: pantheon_reformed
 pantheon_reformed_name: "만신전 개혁"

 # special_doctrine_no_decision
 special_doctrine_no_decision_name: "전통 유지"
 special_doctrine_no_decision_desc: "만신전에 대한 새로운 결정을 내리지 않은 채, 선조에게서 이어받은 숭배 전통을 유지합니다."

 # special_doctrine_status_quo
 special_doctrine_status_quo_name: "현상 유지"
 special_doctrine_status_quo_desc: "현재의 조상 숭배와 신앙 질서를 유지합니다."

 # special_doctrine_adopt_monothesism
 special_doctrine_adopt_monothesism_name: "유일신 신앙 수용"
 special_doctrine_adopt_monothesism_desc: "만신전의 여러 신을 대신하여 하나의 신을 숭배하는 길을 선택합니다."

 # special_doctrine_restore_pantheon
 special_doctrine_restore_pantheon_name: "만신전 복원"
 special_doctrine_restore_pantheon_desc: "흩어진 숭배 전통을 모아 만신전의 여러 신을 다시 함께 모십니다."

 # special_doctrine_end_of_pantheon
 special_doctrine_end_of_pantheon_name: "만신전 폐지"
 special_doctrine_end_of_pantheon_desc: "만신전의 권위를 거두고 신앙의 새로운 질서를 세웁니다."

 # Group: path_divided
 path_divided_name: "한국의 계승"

 # special_doctrine_path_of_peoples
 special_doctrine_path_of_peoples_name: "민중의 길"
 special_doctrine_path_of_peoples_desc: "한국의 정당한 계승자는 민중입니다. 공동체를 이루는 사람들의 뜻을 존중해야 합니다."

 # special_doctrine_path_of_seoul
 special_doctrine_path_of_seoul_name: "서울의 길"
 special_doctrine_path_of_seoul_desc: "한국의 중심은 서울입니다. 서울의 권위와 유산을 이어받는 것이 한국을 계승하는 길입니다."

 # special_doctrine_path_of_authority
 special_doctrine_path_of_authority_name: "권위의 길"
 special_doctrine_path_of_authority_desc: "강력한 지도자의 권위 아래 한국을 하나로 묶고 옛 영광을 되찾아야 합니다."

 # special_doctrine_path_of_unity
 special_doctrine_path_of_unity_name: "통합의 길"
 special_doctrine_path_of_unity_desc: "흩어진 한국의 유산을 다시 하나로 모아 옛 대한민국의 질서를 되살려야 합니다."

 # Group: doctrine_religion_policy
 doctrine_religion_policy_name: "종교 정책"

 # religion_policy_ultranationalism
 religion_policy_ultranationalism_name: "국수주의"
 religion_policy_ultranationalism_desc: "[ROOT.Faith.GetName]를 제외한 모든 이들은 오염되었기에 마땅히 없어져야 합니다."

 # religion_policy_state_atheism
 religion_policy_state_atheism_name: "국가 무신론"
 religion_policy_state_atheism_desc: "신은 없으며 종교는 아편에 불과하다는 것은 [ROOT.Faith.GetName]를 따르는 사람들 사이에서는 상식과도 같습니다."

 # religion_policy_laicite
 religion_policy_laicite_name: "정교 분리"
 religion_policy_laicite_desc: "종교는 공공의 영역에 개입할 수 없으며, 세속 권력과 엄격히 분리됩니다. 종교를 믿을 수는 있지만, 개인적 영역에 한해서만 허용될 뿐입니다."

 # religion_policy_freedom_of_religion
 religion_policy_freedom_of_religion_name: "종교의 자유"
 religion_policy_freedom_of_religion_desc: "모든 사람은 종교를 자유롭게 믿거나, 믿지 않을 권리가 있습니다. 종교를 내걸고 활동하는 것도 허용됩니다."

 # religion_policy_pluralism
 religion_policy_pluralism_name: "다원주의"
 religion_policy_pluralism_desc: " 모든 의견은 나름의 진리를 품고 있으니, 모든 사람들이 의견을 자유롭게 공유한다면 더욱 이로울 것입니다."

 # Additional doctrine types
 doctrine_atheist_desc: "애초에 신이라는 개념이 필요할까요? 인간은 인간으로서 사는 것이고, 신이란 그저 지어낸 허상에 불과합니다. 남들이 마음껏 떠들도록 내버려 두십시오."
 doctrine_atheist_name: "무신론자"
 ideology_hostility_doctrine_desc: "이 신앙은 초월적인 신보다 인간 사회의 질서와 이상을 중심으로 세워진 이념 계통에 속합니다."
 ideology_hostility_doctrine_name: "이념 계통"
