 doctrine_parameter_communism_syncretic_recipient_opinion_active: "공산주의 [faiths|E]과의 상호 $VALUE|=+0$ [opinion|E] 보너스"
 doctrine_parameter_halved_holy_wars_active: "[holy_wars|E]의 신앙 비용: #P -50%#!"
