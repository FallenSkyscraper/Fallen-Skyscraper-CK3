 doctrine_parameter_plain_faith_syncretic_actor_opinion_active: "$tenet_plain_faith_syncretism_name$ [core_tenet|E]를 가진 [faiths|E]과의 상호 $VALUE|=+0$ [opinion|E] 보너스"
 doctrine_parameter_plain_faith_syncretic_recipient_opinion_active: "만주 및 텡그리 [faiths|E]과의 상호 $VALUE|=+0$ [opinion|E] 보너스"
 doctrine_parameter_tenet_easy_to_leave: "이 신앙을 따르는 영지의 개종 저항: #N -20%#!"
