l_korean:

 # Source: common/religion/tenet_types/fs_tenets.txt

 # tenet_protestantism
 tenet_protestantism_name: "종교개혁주의"
 tenet_protestantism_desc: "종교 개혁의 때가 도래했습니다. 우리는 거짓된 믿음을 버리고, 진실된 믿음을 향해 나아가야 합니다."

 # tenet_cheondoism
 tenet_cheondoism_name: "인내천"
 tenet_cheondoism_desc: "사람은 곧 하늘과 같으니, 사람 사이에는 높고 낮음이 없으며, [ROOT.Faith.HighGodName]은 바로 우리 안에 있는 것입니다."

 # tenet_righteous_army
 tenet_righteous_army_name: "의병"
 tenet_righteous_army_desc: "우리는 압제자에 굳건히 맞서 싸울 것입니다. 우리는 고난에 맞서 들고 일어날 것입니다. \n[ROOT.Faith.GetName] 백성들은 이교 영주의 압제가 닥쳐 올 때, 무력으로라도 스스로를 보호할 것입니다."
 tenet_righteous_army_donghak: "동학군"

 # tenet_inquiry_into_knowledge
 tenet_inquiry_into_knowledge_name: "격물치지"
 tenet_inquiry_into_knowledge_desc: "세상에는 정말 신비로운 것들이 많습니다. 그리고 종교의 의무는 그 신비들을 설명하는 것이죠. 다른 종교들이 신비를 그저 신비로써 대할 때, 이들은 신비를 해부하여 그 정체를 밝히고자 합니다."

 # tenet_protracted_warfare
 tenet_protracted_warfare_name: "지구전"
 tenet_protracted_warfare_desc: "마오 주석은 농촌을 중시하면서 농민들의 인심을 곧 힘으로써 사용하는 방법을 강조했습니다."

 # tenet_world_revolution
 tenet_world_revolution_name: "세계혁명"
 tenet_world_revolution_desc: "혁명은 한 나라에서만 일어날 수 없다. 공산주의 혁명은 한 나라가 아니라 모든 문명 국가들에서 동시에 일어날 것이다. 그것은 세계의 다른 여러 나라들에도 커다른 영향을 주어 그 나라들의 지금까지의 발전 과정을 빨리 변화시키고 매우 촉진할 것이다. 이것은 하나의 세계 혁명이며, 따라서 세계 전체를 자신의 무대로 삼을 것이다."

 # tenet_diamat
 tenet_diamat_name: "변증법적 유물론"
 tenet_diamat_desc: "유물론은 물질, 즉 현실 세계에 실재하는 물질적 조건들이 사회를 구성한다고 봅니다. 변증법적 유물론은 이에 더해 물질의 운동을 강조합니다. 물질적, 기술적인 발전이 기존의 사회에 균열을 일으키고, 사람들의 내면 인식까지 변화시키게 됩니다."

 # tenet_new_world
 tenet_new_world_name: "신천"
 tenet_new_world_desc: "새로운 하늘이 열렸습니다. 옛 생각들과 이별하고, 새로운 시대에 걸맞는 새로운 사상을 찾아 떠나야 할 때입니다."

 # tenet_communism_syncretism
 tenet_communism_syncretism_name: "공산주의 포용주의"
 tenet_communism_syncretism_desc: "공산주의는 과격하기는 해도, 이치에 맞는 이야기를 포함하고 있습니다. 한번 그들의 주장에 귀를 기울여 보는 것도 어떨까요?"

 # tenet_plain_faith_syncretism
 tenet_plain_faith_syncretism_name: "초원 신앙 융화주의"
 tenet_plain_faith_syncretism_desc: "초원에는 초원의 법도가 있기 마련입니다. 그리고, 이제 당신도 말에 올라타서 달려나가야 할 때입니다."

 # tenet_populism
 tenet_populism_name: "민중주의"
 tenet_populism_desc: "민중의 목소리가 곧 신이 위정자들에게 원하는 것입니다. 이들의 목소리는 존중받아 마땅합니다."

 # tenet_authoritarianism
 tenet_authoritarianism_name: "권위주의"
 tenet_authoritarianism_desc: "권위야 말로 정의입니다. 강력한 권위의 명령은 마땅히 이행되어야 합니다."

 # tenet_mixed
 tenet_mixed_name: "혼종"
 tenet_mixed_desc: "이 종교는 수많은 신들과 교리들이 정립된 바 없이 뒤섞여 있습니다."

 # tenet_prosperity_theology
 tenet_prosperity_theology_name: "기복신앙"
 tenet_prosperity_theology_desc: "물질에 대한 열망은 누구에게나 있습니다. 이들은 그 진실을 순순히 받아들입니다"

 # tenet_totalitarianism
 tenet_totalitarianism_name: "전체주의"
 tenet_totalitarianism_desc: "개인의 뜻보다 공동체의 의지가 앞서야 하며, 공동체의 의지는 강력한 지도자를 통해 드러납니다. 하나의 권위 아래 결집할 때에만 옛 한국의 영광을 되찾을 수 있습니다."

 # tenet_philosophy_of_hate
 tenet_philosophy_of_hate_name: "혐오의 철학"
 tenet_philosophy_of_hate_desc: "우리의 공동체를 위협하는 이방인에게 관용을 베풀 이유는 없습니다. 적을 향한 분노와 끊임없는 투쟁으로 신앙의 순수함을 지켜야 합니다."

 # tenet_monster_of_the_old_world
 tenet_monster_of_the_old_world_name: "옛 시대의 흉물"
 tenet_monster_of_the_old_world_desc: "옛 세계의 유산은 오직 그 정당한 계승자에게만 허락되어야 합니다. 다른 신앙과 풍습을 받아들이는 것은 선조의 유산을 더럽히는 일이기에, 우리 공동체의 경계를 엄격히 지켜야 합니다."

 # Base-game tenet overrides
 tenet_religious_legal_pronouncements_desc: "자, 혀를 빼들어라! 누가 옳은지 말솜씨로 겨뤄보자!"
 tenet_religious_legal_pronouncements_halakha: "논검"
 tenet_ritual_hospitality_alternate_name: "잔치"

 # Selection requirements
 incompatible_tenet_authoritarianism_populism_trigger: "$tenet_populism_name$를 선택하면 $tenet_authoritarianism_name$를 선택할 수 없음"
 incompatible_tenet_dharmic_pacifism_trigger: "$tenet_dharmic_pacifism_name$와 함께 선택할 수 없음"
 incompatible_tenet_hedonistic_trigger: "$tenet_hedonistic_name$와 함께 선택할 수 없음"
 incompatible_tenet_other_syncretism_trigger: "다른 신앙 융화주의 핵심 교리와 함께 선택할 수 없음"
 incompatible_tenet_pacifism_trigger: "$tenet_pacifism_name$와 함께 선택할 수 없음"
 incompatible_tenet_populism_authority_trigger: "$doctrine_spiritual_head_name$, $doctrine_temporal_head_name$, $doctrine_theocracy_temporal_name$, $tenet_pentarchy_name$ 또는 $tenet_authoritarianism_name$를 선택하면 $tenet_populism_name$를 선택할 수 없음"
 incompatible_tenet_shared_hof_cannibals_vs_non_cannibals: "식인을 받아들이는 신앙과 거부하는 신앙은 같은 종교 지도자를 따를 수 없음"
 incompatible_tenet_shared_hof_criminal_witches_vs_adorcists: "주술을 범죄로 여기는 신앙과 영적 교감을 중시하는 신앙은 같은 종교 지도자를 따를 수 없음"
 incompatible_tenet_shared_hof_hedonists_vs_ascetics: "쾌락주의와 금욕주의 신앙은 같은 종교 지도자를 따를 수 없음"
 incompatible_tenet_shared_hof_monogamy_vs_polygamy: "일부일처제와 복혼제를 따르는 신앙은 같은 종교 지도자를 따를 수 없음"
 incompatible_tenet_shared_hof_pacifists_vs_warmongers: "평화주의와 전쟁을 중시하는 신앙은 같은 종교 지도자를 따를 수 없음"
 incompatible_tenet_shared_hof_world_vs_humsac_grufes: "현재 종교 지도자의 신앙은 인신 공양을 받아들이지 않음"
 incompatible_tenet_shared_hof_world_vs_unrestricted_incest: "현재 종교 지도자의 신앙은 무제한 근친혼을 받아들이지 않음"

