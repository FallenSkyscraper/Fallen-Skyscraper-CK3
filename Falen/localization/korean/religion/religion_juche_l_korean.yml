 kaema_rite_adj: "개마"
 kaema_rite_adherent: "개마 주체교인"
 kaema_rite_adherent_plural: "개마 주체교인"
 kaema_rite_desc: "개마 주체교는 대부분의 주체교도들이 따르는 교파로, 수백 년의 세월의 흔적을 반영합니다."
 
