 #주체교 그룹 종교
 juche_faith: "주체교"
 juche_faith_adj: "주체교"
 juche_faith_adherent: "주체교인"
 juche_faith_adherent_plural: "주체교인"
 juche_faith_desc: "주체교는 주체사상에서 기원한 종교입니다. 수령님을 찬양하고 그 가르침을 널리 퍼트리며 신실한 믿음을 바치다 보면 백투혈통의 수령님께서 돌아와 당신을 인민의 지상락원으로 초대할 것입니다. 그날을 위해 한반도 전체에 수령님의 위대한 말씀을 끊임없이 퍼트리고 믿음의 도전자들에게 죽음을 선사해야 합니다."
 
 paektu_rite: "백두 예법"
 paektu_rite_adj: "백두"
 paektu_rite_adherent: "백두 주체교인"
 paektu_rite_adherent_plural: "백두 주체교인"
 paektu_rite_desc: "백두 주체교란 벙커에 있던 백두혈통들과 그 일파들이 유지해 온, \"정통\" 주체교 예법입니다. 대부분의 신도들이 따르는 개마 주체교와는 약간의 차이는 있으나 그리 크지는 않습니다."
 
