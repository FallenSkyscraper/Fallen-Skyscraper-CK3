 haeseo_juche: "해서주체교"
 haeseo_juche_adj: "해서주체교"
 haeseo_juche_adherent: "해서주체교인"
 haeseo_juche_adherent_plural: "해서주체교인"
 haeseo_juche_desc: "해서의 비옥한 땅에서 주체교도들은 한울님의 말씀 역시 받아들였습니다. 한울님은 언제나 우리 곁에서 삶을 령도해 주시고 주체적으로 살아갈 용기와 믿음을 주십니다. 령도자는 한울님이 이 땅에 임하신 형상일 뿐 본질이 아닙니다. 해서주체교의 수행자들은 천도교로 마음을 보듬고 주체교로 현실을 직조합니다. "
 haeseo_juche_fate_god_name: "지극하신 령도자 한울님"
 haeseo_juche_fate_god_name_possessive: "지극하신 령도자 한울님의"
 haeseo_juche_knowledge_god_name: "혁명적 지식의 한울님"
 haeseo_juche_knowledge_god_name_possessive: "혁명적 지식의 한울님의"
 haeseo_juche_war_god_name: "영성전쟁의 최고사령관 한울님"
 haeseo_juche_war_god_name_possessive: "영성전쟁의 최고사령관 한울님의"
 haeseo_juche_trickster_god_name: "서학 제국주의 분자"
 haeseo_juche_trickster_god_name_possessive: "서학 제국주의 분자들의"

 inmin_juche: "인민주체교"
 inmin_juche_adj: "인민주체교"
 inmin_juche_adherent: "인민주체교인"
 inmin_juche_adherent_plural: "인민주체교인"
 inmin_juche_desc: "인민주체교는 수령님의 말씀보다는 인민의 주체적인 행동을 중요시합니다. 지난 수백년간 수령님은 없었지만 인민들은 서로를 보듬어 주며 진실로 주체적인 삶을 영위하였습니다. 이들은 백두혈통이라는 허상을 배격합니다."