 nightglow_desc: "야광교는 신성한 혈통과 영적 체험을 통해 도에 다가가고자 하는 신앙입니다. 신령과 교감하는 이들은 각지를 떠돌며 가르침을 전하고, 세상의 어둠 속에서 도의 빛을 찾습니다."
