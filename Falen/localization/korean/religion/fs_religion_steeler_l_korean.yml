 # Source: common/religion/religion_types/fs_steelers_pagan.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Religion: steeler_religion
 steeler_religion: "태철교"
 steeler_religion_adj: "태철교"
 steeler_religion_adherent: "태철교도"
 steeler_religion_adherent_plural: "태철교도"
 steeler_religion_desc: "태초에 철이 있었고 그 철로부터 인류 문명이 비롯되었습니다. 철은 고대 한국의 위대한 발전을 선도했던 상징이자 구원입니다. 옛 문명을 되살리고 새로운 문명을 만드는 일은 오직 철로써 이룰 뿐입니다."

 # Faith: steeler
 steeler: "태철교"
 steeler_adj: "태철교"
 steeler_adherent: "태철교도"
 steeler_adherent_plural: "태철교도"
 steeler_desc: "포항의 사람들은 철을 숭배합니다. 그들은 철을 숭배하며 성실히 철제 무기들을 만들어 패권을 확립했습니다. 포항의 모든 사람들이 녹슬어 사라지기 전까지 그들의 고로는 끓어오를 것입니다."

 # Reformation: steeler
 steeler_old: "옛 태철교"
 steeler_old_adj: "옛 태철교"
 steeler_old_adherent: "$steeler_adherent$"
