l_korean:

 # Source: common/religion/religion_types/00_buddhism.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Faith: won_buddhism
 won_buddhism: "원불교"
 won_buddhism_adj: "원불교"
 won_buddhism_adherent: "원불교인"
 won_buddhism_adherent_plural: "원불교인"
 won_buddhism_desc: "소태산 박중빈이 5세기 전 창시한 원불교는 불법의 현실화와 실용성을 중시하는 종교입니다. 사건 이후 성장한 신성복음연합을 내세운 제국국교회의 박해로 인해 원불교의 교세는 크게 쇠퇴하고 창시자의 고향땅인 영광의 영산성지 근처에서 간신히 그 교세를 유지하였습니다. 주변 기독교 세력의 견제로 인해 원불교는 대종사마저 잃어버리고 수행자들과 교무들은 떠돌아다니는 신세가 되었습니다. 중앙총부이자 원불교의 심장이나 다름없는 익산은 야차같은 자들에게 넘어갔지만 원불교는 포기하지 않을 것입니다."

 # Rite: jogye
 jogye: "조계종"
 jogye_adj: "조계종"
 jogye_adherent: "조계종 신도"
 jogye_adherent_plural: "조계종 신도"
 jogye_desc: "조계종은 선 수행을 통해 자신의 본성을 깨닫고자 하는 불교 종파입니다. 절제와 청빈을 지키며 내면을 돌아보는 수행을 중시합니다."

 # Rite: bailian
 bailian: "백련종"
 bailian_adj: "백련종"
 bailian_adherent: "백련종 신도"
 bailian_adherent_plural: "백련종 신도"
 bailian_desc: "백련종은 공동체의 결속과 신비로운 가르침을 중시하는 불교 종파입니다. 신도들은 자연을 존중하고 서로를 돌보며 깨달음에 이르고자 합니다."

 # Rite: gelugpa
 gelugpa: "겔룩파"
 gelugpa_adj: "겔룩파"
 gelugpa_adherent: "겔룩파 신도"
 gelugpa_adherent_plural: "겔룩파 신도"
 gelugpa_desc: "겔룩파는 티베트에서 발달한 불교의 한 갈래입니다. 지도자는 달라이 라마입니다. 몽골에서는 젭춘담바 후툭트라는 자가 지도자가 됩니다."
