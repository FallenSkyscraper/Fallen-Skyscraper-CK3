 #공산주의 그룹 종교
 marxism: "맑스레닌주의"
 marxism_adj: "맑스주의"
 marxism_adherent: "맑스레닌주의자"
 marxism_adherent_plural: "맑스레닌주의자"
 marxism_desc: "맑스주의는 19세기 독일의 학자 맑스가 발전시킨 이론 체계로, 스스로를 과학적 사회주의라 칭합니다."
 
 anti_revisionism: "반수정주의"
 anti_revisionism_adj: "반수정주의"
 anti_revisionism_adherent: "반수정주의자"
 anti_revisionism_adherent_plural: "반수정주의자"
 anti_revisionism_desc: "반수정주의란 맑스, 레닌, 스탈린으로 이어지는 맑스레닌주의의 정통 계보를 충실히 따르고자 하는 사상입니다. 또한 스탈린 사후 벌어진 스탈린 격하 운동을 크나큰 잘못으로 보며, 소련 패망의 원인을 부분적 수정주의에서 찾습니다."
 
 reformism: "개량주의"
 reformism_adj: "개량주의"
 reformism_adherent: "개량주의자"
 reformism_adherent_plural: "개량주의자"
 reformism_desc: "개량주의, 또는 수정주의란 스탈린 사후 공산당의 노선을 조정하려고 한 계파를 일컫는 말입니다. 개량, 또는 수정의 정도는 매우 다양하며, 공산주의 자체에서 이탈하는 정도까지의 노선 전환도 존재했습니다. 여기서 개량주의자들이란 반수정주의자들과 라이벌 관계를 형성한 이들을 뜻합니다."
 
 internationalism: "국제주의"
 internationalism_adj: "국제주의"
 internationalism_adherent: "국제주의자"
 internationalism_adherent_plural: "국제주의자"
 internationalism_desc: "국제주의자들은 평의회 공화국을 세우는 것만이 끝이 아니라, 전 세계에 공산주의를 전파하는 것만이 옳은 길이라고 믿습니다. 그렇지 않으면 곧 몰려드는 반동의 물결에 혁명은 쓸려나가고 말 것이기 때문입니다."
 
 mlm_rite: "맑스레닌마오주의"
 mlm_rite_adj: "MLM"
 mlm_rite_adherent: "맑스레닌마오주의자"
 mlm_rite_adherent_plural: "맑스레닌마오주의자"
 mlm_rite_desc: "맑스-레닌-마오주의, 줄여서 MLM 이론은 정통 맑스레닌주의와 마오주의 간의 결합입니다."

 new_left: "신좌파"
 new_left_adj: "신좌파"
 new_left_adherent: "신좌파"
 new_left_adherent_plural: "신좌파"
 new_left_desc: "혁명이 일단 성공했다고 혁명이 끝났다는 것은 아닙니다. 일부 급진적인 마르크스주의자 무리들은 혁명 지도부가 관료주의와 수정주의에 빠져 혁명을 배반했다고 비판합니다. 이들은 제2의 혁명을 일으켜 정치, 경제, 문화, 성 등 사회 전반을 혁명적으로 변혁하려고 합니다."
 maoism: "마오주의"
 maoism_adj: "마오주의"
 maoism_adherent: "마오주의자"
 maoism_adherent_plural: "마오주의자"
 maoism_desc: "마오 주석이 중국 대륙을 통일한 후, 그의 말은 하나의 경전이고 법전이 되었습니다. 이들은 끊임없이 농촌에서 세력을 모아 해방구를 만들고 공산주의에 걸맞지 않은 우상을 파괴하여 새로운 문화대혁명을 일으키려 합니다."
 
 xiism: "신시대 중국특색 사회주의"
 xiism_adj: "중국특색 사회주의"
 xiism_adherent: "중국특색 사회주의자"
 xiism_adherent_plural: "중국특색 사회주의자"
 xiism_desc: "시 주석은 마오 주석의 가르침에서 벗어난 적은 없었지만 그는 중국 공산당의 힘을 사건 이전에 세계에 펼치려 한 인물입니다. 끝없는 확장과 세계정복만이 곧 정의입니다."