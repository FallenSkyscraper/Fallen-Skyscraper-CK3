 # Source: common/religion/religion_types/fs_koreanism.txt
 # Unlisted inherited terms use the base-game Korean localization.

 # Religion: koreanism_religion
 koreanism_religion: "한국교"
 koreanism_religion_adj: "한국교"
 koreanism_religion_adherent: "한국교인"
 koreanism_religion_adherent_plural: "한국교인"
 koreanism_religion_desc: "한반도에 살았던 위대한 선조들의 문명은 마땅히 계승되어야 하고 전승자가 있어야 합니다. 한국교도는 저마다의 방식으로 대한민국의 흔적을 읽어내고자 합니다."

 # Faith: koreanism_faith
 koreanism_faith: "한국교"
 koreanism_faith_adj: "한국교"
 koreanism_faith_adherent: "한국교도"
 koreanism_faith_adherent_plural: "한국교도"
 koreanism_faith_desc: "한반도에 살았던 위대한 선조들의 문명은 마땅히 계승되어야 하고 전승자가 있어야 합니다. 한국교도는 저마다의 방식으로 대한민국의 흔적을 읽어내고자 합니다."

 # Faith: seoulism
 seoulism: "서울파"
 seoulism_adj: "서울파"
 seoulism_adherent: "서울파"
 seoulism_adherent_plural: "서울파"
 seoulism_desc: "한반도의 빛나는 보석, 어느 곳과도 비교 불가한 유일무이한 공간, 갈망의 도시 서울은 너무나도 '특별'합니다. 너무나도 특별한 이 도시는 그 안에 거주하는 모든 이들에게 특별함을 부여합니다. 서울에 살기에 그들은 행복합니다."

 # Faith: sixth_republic
 sixth_republic: "고대 한국교"
 sixth_republic_adj: "고대 한국교"
 sixth_republic_adherent: "고대 한국교"
 sixth_republic_adherent_plural: "고대 한국교"
 sixth_republic_desc: "사건 이후 어떤 이들은 오랜 시간 '대한민국'을 지켜 왔습니다. 이 끔찍하고 야만적으로 변해버린 세상을 원래대로 복구하여 한국을 재건할 수 있는 것은 오직 이들 뿐입니다."

 # Rite: old_koreanism
 old_koreanism: "고대 한국교"
 old_koreanism_adj: "고대 한국교"
 old_koreanism_adherent: "고대 한국교"
 old_koreanism_adherent_plural: "고대 한국교"
 old_koreanism_desc: "한국교의 초기 원형에 가까운 모습입니다. 옛 대한민국의 모습이 남아 있으며, 한국교가 여러 교파로 분화되기 이전의 초기 상태라 할 수 있습니다."

 # Rite: populism
 populism: "민중파"
 populism_adj: "민중파"
 populism_adherent: "민중파"
 populism_adherent_plural: "민중파"
 populism_desc: "고대 한국에서는 민중의 의견이 존중되고 위대한 선지자들은 그들의 의견을 통치 전반에 받아들였다고 합니다. 이 시대는 너무나도 타락하여 민중의 의견을 박해하고 무시하는 참주들이 가득합니다. 그들은 단결된 민중의 분노와 힘을 두려워해야 할 것입니다."

 # Rite: authoritarianism
 authoritarianism: "권위파"
 authoritarianism_adj: "권위파"
 authoritarianism_adherent: "권위파"
 authoritarianism_adherent_plural: "권위파"
 authoritarianism_desc: "고대 한국의 영광스러운 시절에는 언제나 권위있는 지도자들이 있었습니다. 그들의 영도 오래 한국은 일치단결하고 결사분란하여 찬란하고 아름다운 문명이 건설되었습니다. 그 과실은 위대한 지도자의 주관 아래 모든 신민들에게 베풀어 졌습니다. 그들은 혼란스러운 이 시대를 끝내고 한국을 영원히 하나로 만들 수 있는 것은 백마를 타고 나타날 초인 뿐임을 믿어 의심치 않습니다."
 
 jajuism: "자주파"
 jajuism_adj: "자주파"
 jajuism_adherent: "자주파"
 jajuism_adherent_plural: "자주파"
 jajuism_desc: "자주파는 다른 한국교도들과 비슷하면서도 다릅니다. 다른 한국교도가 '대한민국'에 집중할 때, 자주파는 '통일 한국'을 중시합니다. 즉 북한 지역까지 한국교가 포괄해야 할 영역으로 인식한다는 뜻입니다. \n또한 이들은 보통의 한국교 교리와는 다르게 '북괴'를 신앙적 적대 대상으로 삼지 않으며, 대신 민족의 통일을 방해하는 외세를 적대합니다. 그렇기에 다른 한국교도로부터 공산주의자라는 의심을 받으며 탄압받았습니다."

