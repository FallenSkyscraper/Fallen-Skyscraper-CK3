l_korean:
 trade_good_tobacco: "담배"
 trade_good_tobacco_desc: "잎을 말려 가공하는 기호 작물입니다. 특유의 향 때문에 소비되며, 재배지와 가공 방식에 따라 품질이 달라집니다."
 trade_good_potato: "감자"
 trade_good_potato_desc: "땅속의 덩이줄기를 수확하는 식량 작물입니다. 삶거나 구워 먹으며, 곡물과 함께 사람들의 식탁을 지탱합니다."
 trade_good_maize: "옥수수"
 trade_good_maize_desc: "굵은 이삭에 알곡이 맺히는 식량 작물입니다. 알곡은 그대로 먹거나 말려 빻으며, 가축의 먹이로도 쓰입니다."
 trade_good_chili: "고추"
 trade_good_chili_desc: "음식에 매운맛을 더하는 고추 열매입니다. 생으로 쓰거나 말려 보관하며, 지역마다 독특한 조리와 양념 문화의 바탕이 됩니다."
 trade_good_sweet_potato: "고구마"
 trade_good_sweet_potato_desc: "단맛이 나는 덩이뿌리를 수확하는 식량 작물입니다. 굽거나 쪄서 먹으며, 말려 보관하기도 합니다."
 trade_good_spirits: "증류주"
 trade_good_spirits_desc: "발효한 술을 증류해 얻는 도수 높은 술입니다. 원료와 증류 방식에 따라 향과 맛이 달라지며, 잔치와 접대에 쓰입니다."
 trade_good_opium: "아편"
 trade_good_opium_desc: "양귀비에서 얻은 진액을 말려 만든 물질입니다. 진통과 진정에 쓰이는 약재이자 기호품으로 거래됩니다."
 trade_good_coal: "석탄"
 trade_good_coal_desc: "땅속에서 캐내는 검은 광물 연료입니다. 불을 오래 유지할 수 있어 난방과 여러 수공업 공정에 쓰입니다."
 trade_good_ginseng: "인삼"
 trade_good_ginseng_desc: "독특한 향과 맛으로 귀하게 여겨지는 인삼 뿌리입니다. 말려 오래 보관하며 선물과 접대에 쓰입니다."
 trade_good_slave: "노예"
 trade_good_slave_desc: "노예제 아래에서 자유를 박탈당하고 매매되는 사람들입니다. 그들의 처지는 각 사회의 관습과 법에 따라 규정됩니다."
 trade_category_fuel: "연료"
 trade_category_fuel_desc: "석탄을 비롯해 난방과 수공업 공정에 쓰이는 연료입니다."
 trade_category_slaves: "노예"
 trade_category_slaves_desc: "노예제 아래에서 매매되는 사람들을 다루는 별도의 교역 분류입니다."
